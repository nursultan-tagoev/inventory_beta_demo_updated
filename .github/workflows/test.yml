# Тесты гоняются при каждом коммите и в каждом pull request.
# Тесты, которые надо помнить запускать, не запускаются никогда.
name: Тесты

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      # npm install вместо npm ci: файлы заливаются через веб-интерфейс,
      # и lock-файл легко расходится с package.json
      - run: npm install
      - run: npm test
      - run: npm run build
