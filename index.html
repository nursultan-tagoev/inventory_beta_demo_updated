<style>
:root{
  --f:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;--ff:'Fraunces',Georgia,serif;--mono:'JetBrains Mono',ui-monospace,monospace;
  --bg:#F6F7F9;--sur:#fff;--brd:#E8EBF0;--brd2:#DCE0E8;
  --tx:#0F1218;--tx2:#535D6D;--tx3:#949CAB;
  --ink:#4B45E4;--ink-h:#3A34C9;--ink-l:#EEEDFF;--ink-xl:#E0DEFF;
  --gr:#0E9E72;--gr-l:#E7F7F0;--gr-m:#0B7E5B;
  --rd:#E14B4B;--rd-l:#FDECEC;--rd-m:#C13A3A;
  --am:#D9820A;--am-l:#FCF3E4;--am-m:#B26907;
  --pu:#7C5CF6;--pu-l:#F1EDFE;
  --nav:#12151B;--nav2:#1A1E27;--nav3:#262B36;--navm:#8A93A3;
  --sh:0 1px 2px rgba(16,18,24,.04),0 1px 3px rgba(16,18,24,.06);
  --sh2:0 2px 8px rgba(16,18,24,.06),0 8px 24px rgba(16,18,24,.07);
  --sh3:0 24px 60px rgba(16,18,24,.16);
  --r:16px;
}
[data-theme="dark"]{
  --bg:#0A0C10;--sur:#12151B;--brd:#232833;--brd2:#2E3542;
  --tx:#F1F3F7;--tx2:#A5AEBF;--tx3:#6A7382;
  --ink:#7A74FF;--ink-h:#948FFF;--ink-l:#1B1B33;--ink-xl:#2C2C4D;
  --gr:#2CC28E;--gr-l:#0F2620;--gr-m:#2CC28E;
  --rd:var(--rd);--rd-l:#2A1618;--rd-m:var(--rd);
  --am:#E8A13C;--am-l:#2A2113;--am-m:#E8A13C;
  --pu:#9E86FF;--pu-l:#211D38;
  --nav:#0E1116;--nav2:#171B22;--nav3:#232833;--navm:#6A7382;
  --sh:0 1px 2px rgba(0,0,0,.4);
  --sh2:0 2px 10px rgba(0,0,0,.5);
  --sh3:0 24px 60px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;font-size:14px}
body{font-family:var(--f);background:var(--bg);color:var(--tx);height:100vh;overflow:hidden;line-height:1.5;transition:background .3s ease,color .3s ease}
.ff{font-family:var(--ff);font-feature-settings:"tnum"}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
button,input,select{font-family:var(--f)}
button{cursor:pointer;border:none;background:none}
input,select{outline:none}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--brd2);border-radius:4px}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes scaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.card{background:var(--sur);border:1px solid var(--brd);border-radius:var(--r);box-shadow:var(--sh);transition:all .2s ease}
</style>
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("mkt_theme")||"light")}catch(e){}</script>
</head>

function useToast(){
  const[ts,set]=useState([]);
  const toast=useCallback((msg,type="ok")=>{
    const id=Date.now()+Math.random();
    set(p=>[...p,{id,msg,type}]);
    setTimeout(()=>set(p=>p.filter(t=>t.id!==id)),3200);
  },[]);
  return{ts,toast};
}

const Spin=({s=16})=><span style={{display:"inline-block",width:s,height:s,border:"2px solid currentColor",borderTopColor:"transparent",borderRadius:"50%",animation:"spin .7s linear infinite"}}/>;

function Btn({children,onClick,v="primary",size="md",loading,disabled,icon,style:sx={}}){
  const[h,sh]=useState(false);
  const P={sm:"5px 12px",md:"7px 18px",lg:"11px 26px"}[size];
  const FS={sm:11,md:13,lg:14}[size];
  const V={
    primary:{bg:h&&!disabled?"var(--ink-h)":"var(--ink)",c:"white",b:"var(--ink)"},
    secondary:{bg:h&&!disabled?"var(--bg)":"var(--sur)",c:"var(--tx)",b:"var(--brd2)"},
    ghost:{bg:h&&!disabled?"var(--bg)":"transparent",c:"var(--tx2)",b:"transparent"},
    danger:{bg:h&&!disabled?"var(--rd-m)":"var(--rd)",c:"white",b:"var(--rd)"},
    success:{bg:h&&!disabled?"var(--gr-m)":"var(--gr)",c:"white",b:"var(--gr)"},
  }[v]||{bg:"var(--ink)",c:"white",b:"var(--ink)"};
  return(
    <button onMouseEnter={()=>sh(true)} onMouseLeave={()=>sh(false)}
      onClick={!disabled&&!loading?onClick:undefined}
      style={{display:"inline-flex",alignItems:"center",justifyContent:"center",gap:6,padding:P,fontSize:FS,fontWeight:600,borderRadius:9,border:`1px solid ${V.b}`,background:V.bg,color:V.c,cursor:disabled||loading?"not-allowed":"pointer",opacity:disabled||loading?.55:1,whiteSpace:"nowrap",transition:"all .15s",...sx}}>
      {loading?<Spin s={14}/>:icon&&<span>{icon}</span>}{children}
    </button>
  );
}

const Lbl=({c})=><span style={{display:"block",fontSize:11,fontWeight:600,color:"var(--tx2)",marginBottom:5,letterSpacing:".04em",textTransform:"uppercase"}}>{c}</span>;
const Fld=({label,children,full})=><div style={full?{gridColumn:"1/-1"}:{}}><Lbl c={label}/>{children}</div>;

function Inp({value,onChange,placeholder,type="text",style:sx={},onKeyDown,autoFocus,pfx,disabled}){
  const[f,sf]=useState(false);
  return(
    <div style={{position:"relative",display:"flex",alignItems:"center"}}>
      {pfx&&<span style={{position:"absolute",left:10,color:"var(--tx3)",pointerEvents:"none"}}>{pfx}</span>}
      <input type={type} value={value} onChange={onChange} placeholder={placeholder} autoFocus={autoFocus} disabled={disabled}
        onFocus={()=>sf(true)} onBlur={()=>sf(false)} onKeyDown={onKeyDown}
        style={{width:"100%",padding:pfx?"8px 12px 8px 32px":"8px 12px",fontSize:13,border:`1px solid ${f?"var(--ink)":"var(--brd)"}`,borderRadius:9,background:disabled?"var(--bg)":"var(--sur)",color:"var(--tx)",boxShadow:f?"0 0 0 3px var(--ink-l)":"none",transition:"all .15s",...sx}}/>
    </div>
  );
}
function Sel({value,onChange,children,style:sx={}}){
  const[f,sf]=useState(false);
  return(
    <select value={value} onChange={onChange} onFocus={()=>sf(true)} onBlur={()=>sf(false)}
      style={{width:"100%",padding:"8px 12px",fontSize:13,border:`1px solid ${f?"var(--ink)":"var(--brd)"}`,borderRadius:9,background:"var(--sur)",color:"var(--tx)",boxShadow:f?"0 0 0 3px var(--ink-l)":"none",transition:"all .15s",...sx}}>
      {children}
    </select>
  );
}
function Badge({children,color="slate",size="sm"}){
  const m={ink:["var(--ink-l)","var(--ink)"],green:["var(--gr-l)","var(--gr-m)"],red:["var(--rd-l)","var(--rd-m)"],amber:["var(--am-l)","var(--am-m)"],purple:["var(--pu-l)","var(--pu)"],slate:["var(--bg)","var(--tx2)"]};
  const[bg,fg]=m[color]||m.slate;
  return<span style={{display:"inline-flex",alignItems:"center",padding:size==="xs"?"1px 6px":"2px 9px",borderRadius:999,fontSize:size==="xs"?10:11,fontWeight:600,background:bg,color:fg,whiteSpace:"nowrap"}}>{children}</span>;
}
const TBadge=({type})=>{const m={in:["green","Приход"],out:["ink","Выдача"],return:["purple","Возврат"],writeoff:["red","Списание"]};const[c,l]=m[type]||["slate","?"];return<Badge color={c}>{l}</Badge>};

function Toasts({ts}){
  return(
    <div style={{position:"fixed",bottom:20,left:"50%",transform:"translateX(-50%)",zIndex:9999,display:"flex",flexDirection:"column",gap:8,alignItems:"center",pointerEvents:"none"}}>
      {ts.map(t=>(
        <div key={t.id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 20px",borderRadius:12,fontSize:13,fontWeight:500,boxShadow:"var(--sh3)",background:t.type==="error"?"var(--rd)":t.type==="warn"?"var(--am-m)":"var(--nav)",color:"white",whiteSpace:"nowrap",animation:"fadeUp .2s ease"}}>
          {t.type==="error"?"✗":t.type==="warn"?"⚠":"✓"} {t.msg}
        </div>
      ))}
    </div>
  );
}

function Confirm({title,message,onOk,onCancel}){
  return(
    <div style={{position:"fixed",inset:0,zIndex:2000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}} onClick={onCancel}>
      <div style={{position:"absolute",inset:0,background:"rgba(26,24,20,.5)",backdropFilter:"blur(4px)"}}/>
      <div onClick={e=>e.stopPropagation()} style={{position:"relative",background:"var(--sur)",borderRadius:16,width:"100%",maxWidth:380,padding:"24px 28px",boxShadow:"var(--sh3)",animation:"scaleIn .18s ease"}}>
        <div className="ff" style={{fontWeight:700,fontSize:17,marginBottom:8}}>{title}</div>
        <p style={{fontSize:13,color:"var(--tx2)",lineHeight:1.6,marginBottom:20}}>{message}</p>
        <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
          <Btn v="secondary" onClick={onCancel}>Отмена</Btn>
          <Btn v="danger" onClick={onOk}>Подтвердить</Btn>
        </div>
      </div>
    </div>
  );
}

function Sheet({open,onClose,title,children,dirty}){
  const handleClose=()=>{
    if(dirty&&!window.confirm("Есть незаполненные данные. Закрыть?"))return;
    onClose();
  };
  if(!open)return null;
  return(
    <div style={{position:"fixed",inset:0,zIndex:900,display:"flex",alignItems:"flex-end",justifyContent:"center"}} onClick={handleClose}>
      <div style={{position:"absolute",inset:0,background:"rgba(26,24,20,.4)",backdropFilter:"blur(4px)",animation:"fadeIn .2s ease"}}/>
      <div onClick={e=>e.stopPropagation()} style={{position:"relative",background:"var(--sur)",borderRadius:"20px 20px 0 0",width:"100%",maxWidth:600,maxHeight:"88vh",overflow:"auto",boxShadow:"var(--sh3)",border:"1px solid var(--brd)",borderBottom:"none",zIndex:1,animation:"slideUp .28s cubic-bezier(.32,.72,0,1)"}}>
        <div style={{display:"flex",justifyContent:"center",padding:"14px 0 0"}}><div style={{width:44,height:5,borderRadius:3,background:"var(--brd2)"}}/></div>
        {title&&<div className="ff" style={{padding:"12px 26px 0",fontWeight:700,fontSize:20,color:"var(--tx)"}}>{title}</div>}
        <div style={{padding:"14px 26px 32px"}}>{children}</div>
      </div>
    </div>
  );
}

function VoiceBtn({onResult,context}){
  const[on,setOn]=useState(false);const[ok,setOk]=useState(true);const ref=useRef(null);
  const hints={in:"Пример: 100 футболок от Поставщика 1",out:"Пример: выдай Айгерим 5 ручек на конференцию",return:"Пример: возврат от Бакыта 3 блокнота"};
  useEffect(()=>{
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){setOk(false);return}
    const r=new SR();r.lang="ru-RU";r.interimResults=false;
    r.onresult=e=>{onResult(e.results[0][0].transcript);setOn(false)};
    r.onerror=()=>setOn(false);r.onend=()=>setOn(false);
    ref.current=r;
  },[onResult]);
  if(!ok)return<span style={{fontSize:11,color:"var(--tx3)"}}>🎤 только Chrome</span>;
  return(
    <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
      <button onClick={()=>{on?ref.current.stop():ref.current.start();setOn(p=>!p)}}
        style={{display:"flex",alignItems:"center",gap:7,padding:"6px 14px",borderRadius:20,border:`1px solid ${on?"var(--rd)":"var(--brd)"}`,background:on?"var(--rd-l)":"var(--bg)",fontSize:12,fontWeight:600,color:on?"var(--rd)":"var(--tx2)",cursor:"pointer",transition:"all .15s"}}>
        <span style={{animation:on?"blink 1s infinite":"none"}}>{on?"🔴":"🎤"}</span>{on?"Слушаю...":"Голос"}
      </button>
      <span style={{fontSize:11,color:"var(--tx3)"}}>{hints[context]||""}</span>
    </div>
  );
}

function WizardSteps({current,total}){
  return(
    <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:20}}>
      {Array.from({length:total}).map((_,i)=>(
        <React.Fragment key={i}>
          <div style={{width:26,height:26,borderRadius:"50%",background:i+1===current?"var(--ink)":i+1<current?"var(--gr)":"var(--brd)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,color:i+1<=current?"white":"var(--tx3)",transition:"all .2s",flexShrink:0}}>
            {i+1<current?"✓":i+1}
          </div>
          {i<total-1&&<div style={{flex:1,height:2,background:i+1<current?"var(--gr)":"var(--brd)",borderRadius:1,transition:"background .2s"}}/>}
        </React.Fragment>
      ))}
    </div>
  );
}

function Onboarding({role,onDone}){
  const[step,setStep]=useState(0);
  const isAdmin=role==="admin",isManager=role==="manager",isDirector=role==="director";
  const STEP_FEATURES=[
    {ico:"⚡",text:"Real-time: изменения видны всем мгновенно"},
    {ico:"🏢",text:"Данные разделены по филиалам и ролям"},
    {ico:"📊",text:"Полная история каждого товара и движения"},
  ];
  const STEP_FLOWS=[
    {ico:"📥",color:"var(--gr)", title:"Принять товар",  text:"Поставщик привёз — оформляем приход. Остатки обновляются автоматически."},
    {ico:"📤",color:"var(--ink)",title:"Выдать",          text:"Выбираем товар, получателя, указываем цель и срок возврата, фиксируем СЗ."},
    {ico:"🔄",color:"var(--pu)", title:"Вернуть",         text:"Сотрудник вернул товар — оценка состояния, списание с «на руках»."},
  ];
  const ROLE_STEP= isAdmin
    ?{ico:"⚙️",title:"Настройка системы",      text:"Добавьте категории, места хранения, поставщиков и направления в Справочниках."}
    :isManager||isDirector
    ?{ico:"📤",title:"Выдача и приём товаров",  text:"Принимайте товары от поставщиков и выдавайте сотрудникам на мероприятия."}
    :{ico:"👁️",title:"Просмотр остатков",       text:"Вы видите все товары и движения вашего филиала в режиме реального времени."};
  const steps=[
    {pill:"Добро пожаловать",title:"Система учёта\nи складирования",
     sub:"Работает в реальном времени, данные хранятся в облаке. Доступ с любого устройства.",
     content:<div style={{display:"flex",flexDirection:"column",gap:10}}>{STEP_FEATURES.map((f,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 14px",background:"var(--bg)",borderRadius:10,border:"1px solid var(--brd)"}}><span style={{fontSize:20,flexShrink:0}}>{f.ico}</span><span style={{fontSize:13,color:"var(--tx2)",lineHeight:1.4}}>{f.text}</span></div>)}</div>,
     cta:"Как это работает →"},
    {pill:"Как работает",title:"Три операции покрывают\nвесь цикл склада",
     sub:"Каждая операция — трёхшаговый мастер с подсказками, голосовым вводом и итоговым превью.",
     content:<div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10}}>{STEP_FLOWS.map((f,i)=><div key={i} style={{padding:"16px 14px",background:"var(--bg)",borderRadius:12,border:"1px solid var(--brd)",textAlign:"center"}}><div style={{width:44,height:44,borderRadius:12,background:f.color+"18",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,margin:"0 auto 10px"}}>{f.ico}</div><div className="ff" style={{fontWeight:700,fontSize:13,color:"var(--tx)",marginBottom:6}}>{f.title}</div><div style={{fontSize:11,color:"var(--tx3)",lineHeight:1.45}}>{f.text}</div></div>)}</div>,
     cta:isAdmin?"Настройка системы →":"Ваша роль →"},
    {pill:"Ваша роль",title:ROLE_STEP.title,sub:ROLE_STEP.text,
     content:<div style={{display:"flex",flexDirection:"column",gap:8}}>{[{ico:"📦",text:"Добавьте первые товары в каталог"},{ico:"👤",text:"Добавьте получателей (сотрудников)"},{ico:"📥",text:"Оформите первый приход товара"},{ico:"📤",text:"Выдайте товар на первое мероприятие"}].map((item,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:12,padding:"11px 14px",background:"var(--bg)",borderRadius:10,border:"1px solid var(--brd)"}}><div style={{width:28,height:28,borderRadius:"50%",border:"2px solid var(--brd2)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,flexShrink:0}}>{item.ico}</div><span style={{fontSize:13,color:"var(--tx2)"}}>{item.text}</span></div>)}<div style={{marginTop:4,padding:"10px 14px",background:"var(--ink-l)",borderRadius:10,fontSize:12,color:"var(--ink)",display:"flex",gap:8,alignItems:"center"}}><span>💡</span><span>Этот чеклист будет на Главной странице — он исчезнет когда всё выполнено.</span></div></div>,

        <div style={{padding:"20px 32px 28px",display:"flex",alignItems:"center",justifyContent:"space-between",borderTop:"1px solid var(--brd)",marginTop:16}}>
          <button onClick={onDone} style={{fontSize:13,color:"var(--tx3)",cursor:"pointer",background:"none",border:"none",padding:"4px 0"}}>Пропустить</button>
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            {step>0&&<Btn v="secondary" onClick={()=>setStep(s=>s-1)}>← Назад</Btn>}
            <Btn onClick={()=>{if(step<steps.length-1)setStep(s=>s+1);else onDone();}} size="lg">{s.cta}</Btn>

function GettingStarted({flags,setView,onDismiss}){
  const done=flags;
  const total=4,completed=Object.values(done).filter(Boolean).length;
  if(completed===total)return null;
  const items=[
    {key:"addProduct",  ico:"📦",text:"Добавьте первый товар",         view:"items"},
    {key:"addRecipient",ico:"👤",text:"Добавьте получателя",            view:"recipients"},
    {key:"firstIn",     ico:"📥",text:"Оформите первый приход",         view:"activity"},
    {key:"firstOut",    ico:"📤",text:"Выдайте товар сотруднику",       view:"activity"},
  ];
  return(
    <div style={{background:"var(--sur)",border:"1px solid var(--brd)",borderRadius:14,padding:"16px 18px",marginBottom:16,boxShadow:"var(--sh)"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}><span className="ff" style={{fontWeight:700,fontSize:14}}>Начало работы</span><span style={{fontSize:11,color:"var(--tx3)"}}>выполнено {completed} из {total}</span></div>
        <button onClick={onDismiss} style={{fontSize:12,color:"var(--tx3)",cursor:"pointer",padding:"2px 8px",borderRadius:6,border:"1px solid var(--brd)"}}>Скрыть</button>
      </div>
      <div style={{height:4,background:"var(--brd)",borderRadius:999,marginBottom:14,overflow:"hidden"}}><div style={{height:"100%",width:`${(completed/total)*100}%`,background:"var(--gr)",borderRadius:999,transition:"width .4s ease"}}/></div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:8}}>
        {items.map(item=>(
          <div key={item.key} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 12px",background:done[item.key]?"var(--gr-l)":"var(--bg)",borderRadius:10,border:`1px solid ${done[item.key]?"var(--gr)":"var(--brd)"}`,opacity:done[item.key]?.65:1}}>
            <div style={{width:26,height:26,borderRadius:"50%",background:done[item.key]?"var(--gr)":"var(--brd)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:done[item.key]?12:14,color:done[item.key]?"white":"var(--tx3)",flexShrink:0}}>{done[item.key]?"✓":item.ico}</div>
            <span style={{flex:1,fontSize:12,color:done[item.key]?"var(--gr-m)":"var(--tx2)",fontWeight:done[item.key]?600:400,lineHeight:1.3}}>{item.text}</span>
            {!done[item.key]&&<button onClick={()=>setView(item.view)} style={{fontSize:11,color:"var(--ink)",fontWeight:600,cursor:"pointer",background:"none",border:"none",whiteSpace:"nowrap",flexShrink:0}}>Перейти →</button>}
          </div>
        ))}
      </div>
    </div>
  );
}

          <div><div className="ff" style={{fontWeight:400,fontSize:17,color:"white"}}>Система учёта</div><div style={{fontSize:10,color:"var(--navm)"}}>и склада</div></div>

        {groups.map((g,gi)=>(<div key={gi} style={{marginBottom:6}}>
          {g.label&&<div style={{padding:"8px 10px 4px",fontSize:10,fontWeight:600,color:"var(--navm)",letterSpacing:".1em",textTransform:"uppercase"}}>{g.label}</div>}
          {g.items.map(n=>{const act=view===n.id;return(
            <button key={n.id} onClick={()=>setView(n.id)}

              onMouseEnter={e=>{if(!act){e.currentTarget.style.background="var(--nav2)";e.currentTarget.style.color="white"}}}
              onMouseLeave={e=>{if(!act){e.currentTarget.style.background="transparent";e.currentTarget.style.color="var(--navm)"}}}>
              <span style={{fontSize:14,width:20,textAlign:"center",flexShrink:0,opacity:act?1:.7}}>{n.ico}</span>
              <span style={{flex:1}}>{n.l}</span>
              {n.badge>0&&<span style={{background:"var(--rd)",color:"white",borderRadius:999,padding:"1px 6px",fontSize:10,fontWeight:700}}>{n.badge}</span>}
            </button>

      </nav>
      <div style={{padding:"10px 10px",borderTop:"1px solid rgba(255,255,255,.06)"}}>

          <button onClick={()=>{const c=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",c);try{localStorage.setItem("mkt_theme",c)}catch(e){}}} title="Тема"
            style={{width:28,height:28,borderRadius:8,display:"grid",placeItems:"center",color:"var(--navm)",fontSize:14,cursor:"pointer"}}
            onMouseEnter={e=>e.currentTarget.style.color="white"} onMouseLeave={e=>e.currentTarget.style.color="var(--navm)"}>◐</button>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8,padding:"8px 4px",marginTop:8}}>
          <div style={{width:32,height:32,borderRadius:"50%",background:"linear-gradient(135deg,var(--ink),var(--pu))",display:"flex",alignItems:"center",justifyContent:"center",color:"white",fontSize:13,fontWeight:700,flexShrink:0}}>{(profile.name||profile.email||"?")[0].toUpperCase()}</div>
          <div style={{flex:1,minWidth:0}}><div className="ff" style={{fontSize:12,color:"white",fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{profile.name||profile.email}</div><div style={{fontSize:10,color:"var(--navm)"}}>{ROLES[profile.role]||profile.role}</div></div>
          <button onClick={onLogout} title="Выйти" style={{padding:6,borderRadius:7,color:"var(--navm)",cursor:"pointer",fontSize:14,transition:"color .12s"}} onMouseEnter={e=>e.target.style.color="white"} onMouseLeave={e=>e.target.style.color="var(--navm)"}>⎋</button>

  );
}

function ActionCard({item,onOpen}){

    <button onClick={onOpen} onMouseEnter={()=>sh(true)} onMouseLeave={()=>sh(false)}
      style={{textAlign:"left",padding:"22px",background:h?item.accent+"12":"var(--sur)",border:`1px solid ${h?item.accent:"var(--brd)"}`,borderRadius:16,cursor:"pointer",transition:"all .18s",boxShadow:h?"var(--sh2)":"var(--sh)",width:"100%",position:"relative"}}>
      {item.tag&&<div style={{position:"absolute",top:12,right:12,background:item.accent,color:"white",borderRadius:6,padding:"2px 8px",fontSize:10,fontWeight:700}}>{item.tag}</div>}
      <div style={{fontSize:30,marginBottom:12}}>{item.ico}</div>

function ItemCard({p,stock,categories,checkouts,onClick,onArchive,canArchive}){
  const[h,sh]=useState(false);
  const qty=stock[p.id]||0;
  const cat=categories.find(c=>c.id===p.category_id||c.name===p.category_id)||{icon:"📦",color:"var(--ink)"};
  const onH=checkouts.filter(c=>c.product_id===p.id).reduce((a,c)=>a+c.remaining,0);
  let images=[];
  try{images=JSON.parse(p.images||"[]")}catch(e){images=[]}
  const mainImage=images[0]||p.image_url;
  return(
    <div onMouseEnter={()=>sh(true)} onMouseLeave={()=>sh(false)} onClick={onClick}
      style={{background:"var(--sur)",borderRadius:16,border:`1px solid ${h?(cat.color||"var(--ink)")+"80":"var(--brd)"}`,overflow:"hidden",transition:"all .18s",boxShadow:h?"var(--sh2)":"var(--sh)",cursor:"pointer",position:"relative"}}>
      {canArchive&&h&&<button onClick={e=>{e.stopPropagation();onArchive(p.id)}} style={{position:"absolute",top:8,right:8,zIndex:3,background:"var(--rd)",color:"white",borderRadius:999,padding:"2px 10px",fontSize:11,fontWeight:600,boxShadow:"var(--sh)"}}>Архив</button>}
      {images.length>1&&!h&&<div style={{position:"absolute",bottom:44,left:8,display:"flex",gap:4,zIndex:2}}>{images.slice(0,3).map((url,i)=><div key={i} style={{width:22,height:22,borderRadius:4,backgroundImage:`url(${url})`,backgroundSize:"cover",backgroundPosition:"center",border:"1px solid white"}}/>)}</div>}
      <div style={{height:120,background:mainImage?`url(${mainImage}) center/cover`:`linear-gradient(135deg,${cat.color||"var(--ink)"}18,${cat.color||"var(--ink)"}30)`,display:"flex",alignItems:"center",justifyContent:"center",position:"relative"}}>
        {!mainImage&&<span style={{fontSize:36}}>{cat.icon||"📦"}</span>}
        <div style={{position:"absolute",top:8,right:canArchive&&h?40:8,background:"var(--sur)",borderRadius:20,padding:"2px 8px",fontSize:11,fontWeight:700,color:qty===0?"var(--rd)":qty<5?"var(--am)":"var(--gr)",boxShadow:"var(--sh)"}}>{qty} шт</div>
        {onH>0&&<div style={{position:"absolute",top:8,left:8,background:"var(--ink-l)",borderRadius:20,padding:"2px 7px",fontSize:10,fontWeight:600,color:"var(--ink)"}}>↑{onH}</div>}
      </div>
      <div style={{padding:"12px 14px"}}>
        <div className="ff" style={{fontWeight:700,fontSize:13,color:"var(--tx)",marginBottom:2,lineHeight:1.3,overflow:"hidden",display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical",minHeight:34}}>{p.name}</div>
        <div style={{fontSize:11,color:"var(--tx3)"}}>{som(p.price)} · {som(qty*p.price)} всего</div>
      </div>
    </div>
  );
}

function OpForm({type,prefill={},onSave,onCancel,S}){
  const{products,recipients,suppliers,directions,branches,profile,toast,stock}=S;
  const t=type;
  const totalSteps=t==="in"?2:t==="writeoff"?1:3;
  const[step,setStep]=useState(1);
  const[dirty,setDirty]=useState(false);
  const[loading,setL]=useState(false);
  const[confirm,setConfirm]=useState(false);
  const[showNewRec,setShowNewRec]=useState(false);
  const[newRec,setNewRec]=useState({name:"",branch_id:branches[0]?.id||"",sz_id:""});
  const[showNewProd,setShowNewProd]=useState(false);
  const[newProd,setNewProd]=useState({name:"",sku:"",price:""});
  const[createdProd,setCreatedProd]=useState(null);
  const[form,setForm]=useState({
    product_id:prefill.product_id||"",qty:prefill.qty||1,
    recipient_id:prefill.recipient_id||"",branch_id:prefill.branch_id||"",
    purpose:prefill.purpose||"",due_date:"",sz:prefill.sz||"",
    supplier_id:suppliers[0]?.id||"",direction_id:"",condition:"хорошее",notes:""
  });
  const upd=(k,v)=>{setForm(f=>({...f,[k]:v}));setDirty(true)};
  const selProd=useMemo(()=>products.find(p=>p.id==form.product_id),[form.product_id,products]);
  const selRec=useMemo(()=>recipients.find(r=>r.id==form.recipient_id),[form.recipient_id,recipients]);
  useEffect(()=>{if(selProd&&t==="in")setForm(f=>({...f,supplier_id:selProd.supplier_id||f.supplier_id}))},[selProd,t]);
  useEffect(()=>{if(selRec)setForm(f=>({...f,branch_id:selRec.branch_id||f.branch_id}))},[selRec]);

  const handleVoice=useCallback(text=>{
    const low=text.toLowerCase();
    const prod=products.find(p=>(p.name||"").toLowerCase().split(" ").some(w=>w.length>3&&low.includes(w)));
    const rec=recipients.find(r=>(r.name||"").toLowerCase().split(" ").some(w=>w.length>2&&low.includes(w)));
    const qm=low.match(/(\d+)/);
    if(prod)setForm(f=>({...f,product_id:prod.id}));else if(low.length>3)toast("Товар не найден","warn");
    if(rec)setForm(f=>({...f,recipient_id:rec.id}));
    if(qm)setForm(f=>({...f,qty:parseInt(qm[0])}));
    setDirty(true);
  },[products,recipients,toast]);

  const createRecipient=async()=>{
    if(!newRec.name.trim()){toast("Введите имя","error");return}
    const{data,error}=await sb.from("recipients").insert({name:newRec.name,branch_id:Number(newRec.branch_id)||null,sz_id:newRec.sz_id||null}).select().single();
    if(error){toast("Ошибка: "+error.message,"error");return}
    setForm(f=>({...f,recipient_id:data.id,branch_id:data.branch_id||f.branch_id}));
    setShowNewRec(false);setNewRec({name:"",branch_id:branches[0]?.id||"",sz_id:""});toast("Получатель создан");
  };
  const createProduct=async()=>{
    if(!newProd.name.trim()){toast("Введите название","error");return}
    const{data,error}=await sb.from("products").insert({name:newProd.name.trim(),sku:newProd.sku||null,price:Number(newProd.price)||0,archived:false}).select().single();
    if(error){toast("Ошибка: "+error.message,"error");return}
    setForm(f=>({...f,product_id:data.id}));setCreatedProd(data);setShowNewProd(false);setNewProd({name:"",sku:"",price:""});toast("Товар создан");
  };

  const doSave=async()=>{
    if(!form.product_id){toast("Выберите товар","error");return}
    const avail=(stock&&stock[Number(form.product_id)])||0;
    if((t==="out"||t==="writeoff")&&Number(form.qty)>avail){toast(`Недостаточно на складе: доступно ${avail} шт`,"error");return}
    setL(true);
    const{error}=await sb.from("movements").insert({
      type:t,product_id:Number(form.product_id),qty:Number(form.qty),
      location_id:selProd?.location_id||null,issuer_id:profile.id,
      recipient_id:Number(form.recipient_id)||null,
      branch_id:Number(form.branch_id)||selRec?.branch_id||null,
      supplier_id:t==="in"?Number(form.supplier_id)||null:null,
      purpose:t==="out"?form.purpose||null:null,
      due_date:t==="out"?form.due_date||null:null,
      sz:t==="out"?form.sz||null:null,
      direction_id:form.direction_id?Number(form.direction_id):null,
      condition:t==="return"?form.condition:null,
      notes:form.notes||null
    });
    setL(false);
    if(error){toast("Ошибка: "+error.message,"error");return}
    onSave();
  };

  const handleNext=()=>{
    if(step<totalSteps)setStep(s=>s+1);
    else if(t==="writeoff"||(t==="return"&&step===totalSteps))setConfirm(true);
    else doSave();
  };
  const ico={in:"📥",out:"📤",return:"🔄",writeoff:"🗑️"};

  return(
    <div>
      {confirm&&<Confirm title={`Подтвердить ${TL[t]}?`} message={`${TL[t]} ${form.qty} шт. "${selProd?.name||"—"}"${selRec?` от ${selRec.name}`:""}`} onOk={()=>{setConfirm(false);doSave()}} onCancel={()=>setConfirm(false)}/>}
      <WizardSteps current={step} total={totalSteps}/>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:18}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <span style={{fontSize:24}}>{ico[t]}</span>
          <span className="ff" style={{fontWeight:700,fontSize:18,color:TC[t]}}>{TL[t]}</span>
          {step>1&&<span style={{fontSize:12,color:"var(--tx3)"}}>Шаг {step}/{totalSteps}</span>}
        </div>
        <VoiceBtn onResult={handleVoice} context={t}/>
      </div>

      {step===1&&(
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <Fld label="Товар"><Sel value={form.product_id} onChange={e=>{if(e.target.value==="new"){setShowNewProd(true)}else{upd("product_id",e.target.value);setCreatedProd(null)}}}><option value="">— выбрать товар —</option>{createdProd&&<option value={createdProd.id}>{createdProd.name} (новый)</option>}{products.filter(p=>!p.archived).map(p=><option key={p.id} value={p.id}>{p.name}{p.sku?` (${p.sku})`:""}</option>)}<option value="new">➕ Добавить новый товар</option></Sel></Fld>
          {showNewProd&&<div className="card" style={{padding:14,background:"var(--bg)"}}><div className="ff" style={{fontWeight:600,fontSize:13,marginBottom:10}}>Новый товар</div><div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr",gap:10,marginBottom:10}}><Fld label="Название"><Inp value={newProd.name} onChange={e=>setNewProd({...newProd,name:e.target.value})} placeholder="Например, Кружка" autoFocus/></Fld><Fld label="Артикул"><Inp value={newProd.sku} onChange={e=>setNewProd({...newProd,sku:e.target.value})} placeholder="STA-001"/></Fld><Fld label="Цена, сом"><Inp type="number" value={newProd.price} onChange={e=>setNewProd({...newProd,price:e.target.value})} placeholder="0"/></Fld></div><div style={{display:"flex",gap:8}}><Btn size="sm" onClick={createProduct}>Сохранить</Btn><Btn v="secondary" size="sm" onClick={()=>setShowNewProd(false)}>Отмена</Btn></div></div>}
          {selProd&&<div style={{display:"flex",gap:10,padding:"10px 14px",background:"var(--ink-l)",borderRadius:9,fontSize:12,color:"var(--ink)",alignItems:"center"}}><span className="ff" style={{fontWeight:700,fontSize:16}}>{stock?.[selProd.id]||0} шт</span><span>на складе · {som(selProd.price)} за шт.</span></div>}
          <Fld label="Количество"><Inp type="number" value={form.qty} onChange={e=>upd("qty",e.target.value)}/></Fld>
          {t==="in"&&suppliers.length>0&&<Fld label="Поставщик"><Sel value={form.supplier_id} onChange={e=>upd("supplier_id",e.target.value)}>{suppliers.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</Sel></Fld>}
          <div style={{display:"flex",gap:8,marginTop:4}}>{onCancel&&<Btn v="secondary" onClick={onCancel}>Отмена</Btn>}<Btn onClick={handleNext} style={{flex:1}} disabled={!form.product_id}>{t==="writeoff"?"Списать":"Далее →"}</Btn></div>
        </div>
      )}

      {step===2&&(t==="out"||t==="return")&&(
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <Fld label={t==="out"?"Получатель":"Возврат от"}><Sel value={form.recipient_id} onChange={e=>{if(e.target.value==="new")setShowNewRec(true);else upd("recipient_id",e.target.value)}}><option value="">— выбрать —</option>{recipients.map(r=><option key={r.id} value={r.id}>{r.name} ({branches.find(b=>b.id===r.branch_id)?.name||"—"})</option>)}<option value="new">➕ Добавить нового получателя</option></Sel></Fld>
          {showNewRec&&<div className="card" style={{padding:14,background:"var(--bg)"}}><div className="ff" style={{fontWeight:600,fontSize:13,marginBottom:10}}>Новый получатель</div><div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr",gap:10,marginBottom:10}}><Fld label="Имя"><Inp value={newRec.name} onChange={e=>setNewRec({...newRec,name:e.target.value})} placeholder="Полное имя" autoFocus/></Fld><Fld label="Филиал"><Sel value={newRec.branch_id} onChange={e=>setNewRec({...newRec,branch_id:e.target.value})}><option value="">—</option>{branches.map(b=><option key={b.id} value={b.id}>{b.name}</option>)}</Sel></Fld><Fld label="№ СЗ (необяз.)"><Inp value={newRec.sz_id} onChange={e=>setNewRec({...newRec,sz_id:e.target.value})} placeholder="СЗ-001"/></Fld></div><div style={{display:"flex",gap:8}}><Btn size="sm" onClick={createRecipient}>Сохранить</Btn><Btn v="secondary" size="sm" onClick={()=>setShowNewRec(false)}>Отмена</Btn></div></div>}
          <Fld label="Или выбрать филиал напрямую"><Sel value={form.branch_id} onChange={e=>upd("branch_id",e.target.value)}><option value="">— выбрать —</option>{branches.map(b=><option key={b.id} value={b.id}>{b.name} ({b.city})</option>)}</Sel></Fld>
          {t==="return"&&<Fld label="Состояние товара"><Sel value={form.condition} onChange={e=>upd("condition",e.target.value)}><option value="хорошее">✅ Хорошее</option><option value="б/у">⚠ Б/у</option><option value="брак">❌ Брак</option></Sel></Fld>}
          <div style={{display:"flex",gap:8,marginTop:4}}><Btn v="secondary" onClick={()=>setStep(1)}>← Назад</Btn><Btn onClick={handleNext} style={{flex:1}}>Далее →</Btn></div>
        </div>
      )}

      {step===2&&t==="in"&&(
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          {directions.length>0&&<Fld label="Направление"><Sel value={form.direction_id} onChange={e=>upd("direction_id",e.target.value)}><option value="">— не указано —</option>{directions.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}</Sel></Fld>}
          <Fld label="Примечание"><Inp value={form.notes} onChange={e=>upd("notes",e.target.value)} placeholder="Необязательно"/></Fld>
          <div style={{display:"flex",gap:8,marginTop:4}}><Btn v="secondary" onClick={()=>setStep(1)}>← Назад</Btn><Btn onClick={doSave} loading={loading} style={{flex:1}}>Сохранить приход</Btn></div>
        </div>
      )}

      {step===3&&(
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          {t==="out"&&<><Fld label="Цель / мероприятие"><Inp value={form.purpose} onChange={e=>upd("purpose",e.target.value)} placeholder="Конференция, выставка..."/></Fld><Fld label="Вернуть до (необяз.)"><Inp type="date" value={form.due_date} onChange={e=>upd("due_date",e.target.value)}/></Fld><Fld label="Номер СЗ"><Inp value={form.sz} onChange={e=>upd("sz",e.target.value)} placeholder="СЗ-001"/></Fld>{directions.length>0&&<Fld label="Направление"><Sel value={form.direction_id} onChange={e=>upd("direction_id",e.target.value)}><option value="">— не указано —</option>{directions.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}</Sel></Fld>}</>}
          <Fld label="Примечание"><Inp value={form.notes} onChange={e=>upd("notes",e.target.value)}/></Fld>
          <div style={{padding:"12px 14px",background:"var(--bg)",borderRadius:10,border:"1px solid var(--brd)",fontSize:12}}><div className="ff" style={{fontWeight:600,marginBottom:6,fontSize:13}}>Итог операции</div><div style={{color:"var(--tx2)",display:"flex",flexDirection:"column",gap:3}}><div>Товар: <b style={{color:"var(--tx)"}}>{selProd?.name||"—"}</b> × {form.qty} шт</div>{selRec&&<div>Получатель: <b style={{color:"var(--tx)"}}>{selRec.name}</b></div>}{form.purpose&&<div>Цель: {form.purpose}</div>}{form.due_date&&<div>Вернуть до: {form.due_date}</div>}</div></div>
          <div style={{display:"flex",gap:8,marginTop:4}}><Btn v="secondary" onClick={()=>setStep(2)}>← Назад</Btn><Btn onClick={handleNext} loading={loading} style={{flex:1}}>Сохранить операцию</Btn></div>
        </div>
      )}
    </div>
  );
}

function Home({S,stock,checkouts,setView}){
  const{products,recentMovements,branches,recipients,profile,toast,can,gsFlags}=S;
  const[sheet,setSheet]=useState(null);
  const[gsVisible,setGsVisible]=useState(!localStorage.getItem(GS_KEY));
  const active=products.filter(p=>!p.archived);
  const totalQty=active.reduce((a,p)=>a+(stock[p.id]||0),0);
  const totalVal=active.reduce((a,p)=>a+(stock[p.id]||0)*p.price,0);
  const overdue=checkouts.filter(c=>c.due_date&&c.due_date<TODAY);
  const soon=checkouts.filter(c=>c.due_date&&c.due_date>TODAY&&c.due_date<=IN3D);
  const lastOut=useMemo(()=>recentMovements.filter(m=>m.type==="out"&&m.issuer_id===profile?.id)[0],[recentMovements,profile]);
  const recent=recentMovements.slice(0,6);
  const lowStock=active.filter(p=>(stock[p.id]||0)<5);
  const byBranch=branches.map(b=>{const os=checkouts.filter(c=>c.branch_id===b.id);return{...b,qty:os.reduce((a,c)=>a+c.remaining,0),val:os.reduce((a,c)=>a+(active.find(p=>p.id===c.product_id)?.price||0)*c.remaining,0)}});
  const morning=new Date().getHours()<12?"Доброе утро":new Date().getHours()<18?"Добрый день":"Добрый вечер";
  const pName=id=>products.find(p=>p.id===id)?.name??"—";
  const rName=id=>recipients.find(r=>r.id===id)?.name??"—";

  const ACTION_ITEMS=[
    {ico:"📥",type:"in",    title:"Принять товар",  sub:"Новая поставка от поставщика",       accent:"var(--gr)",  prefill:{}},
    {ico:"📤",type:"out",   title:lastOut?"Повторить выдачу":"Выдать товар",
     sub:lastOut?`→ ${rName(lastOut.recipient_id)} · ${pName(lastOut.product_id)}`:"На мероприятие или акцию",
     accent:"var(--ink)", tag:lastOut?"⟳ Повторить":null,
     prefill:lastOut?{product_id:lastOut.product_id,qty:lastOut.qty,recipient_id:lastOut.recipient_id,purpose:lastOut.purpose,sz:lastOut.sz}:{}},
    {ico:"🔄",type:"return",title:"Принять возврат", sub:"Сотрудник вернул товар",              accent:"var(--pu)",  prefill:{}},
  ];

  return(
    <div style={{height:"100%",overflow:"auto",background:"var(--bg)"}}>
      <div style={{padding:"28px 28px 24px",background:"var(--sur)",borderBottom:"1px solid var(--brd)"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:24}}>
          <div><h1 className="ff" style={{fontSize:28,fontWeight:700,color:"var(--tx)",letterSpacing:"-.02em"}}>{morning}, {profile?.name||profile?.email?.split("@")[0]} 👋</h1><p style={{fontSize:13,color:"var(--tx3)",marginTop:4}}>{ROLES[profile?.role]} · {new Date().toLocaleDateString("ru-RU",{weekday:"long",day:"numeric",month:"long"})}</p></div>
          <div style={{display:"flex",gap:8}}><Btn v="secondary" onClick={()=>setView("assistant")} icon="🎙">Люси</Btn><Btn v="secondary" onClick={()=>setView("items")}>Все товары →</Btn></div>
        </div>
        {can("move")?<div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:14}}>{ACTION_ITEMS.map(item=><ActionCard key={item.type} item={item} onOpen={()=>setSheet({type:item.type,prefill:item.prefill})}/>)}</div>
        :<div style={{padding:"16px 18px",background:"var(--bg)",borderRadius:12,border:"1px solid var(--brd)",fontSize:13,color:"var(--tx3)",display:"flex",gap:10,alignItems:"center"}}><span>👁</span><span>Режим просмотра. Операции доступны маркетологам и администраторам.</span></div>}
      </div>
      <div style={{padding:24}}>
        {gsVisible&&can("move")&&<GettingStarted flags={gsFlags} setView={setView} onDismiss={()=>{localStorage.setItem(GS_KEY,"1");setGsVisible(false)}}/>}
        {overdue.length>0&&<div style={{background:"var(--sur)",border:"1px solid var(--rd)",borderLeft:"4px solid var(--rd)",borderRadius:14,padding:"14px 18px",marginBottom:12,animation:"fadeUp .2s ease"}}><div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}><span className="ff" style={{fontWeight:700,fontSize:15,color:"var(--rd)"}}>⚠ Просрочено {overdue.length} выдач</span><Btn v="ghost" size="sm" onClick={()=>setView("branches")}>Подробнее →</Btn></div>{overdue.slice(0,3).map((c,i)=>{const days=Math.floor((new Date()-new Date(c.due_date))/864e5);return<div key={i} style={{fontSize:12,color:"var(--tx2)",display:"flex",gap:8,alignItems:"center",marginBottom:3}}><span style={{fontWeight:600}}>{rName(c.recipient_id)}</span><span>—</span><span>{pName(c.product_id)}</span><span>× {c.remaining} шт</span><Badge color="red">+{days}д</Badge></div>})}</div>}
        {soon.length>0&&<div style={{background:"var(--sur)",border:"1px solid var(--am)",borderLeft:"4px solid var(--am)",borderRadius:14,padding:"12px 18px",marginBottom:12}}><span className="ff" style={{fontWeight:600,fontSize:13,color:"var(--am)"}}>⏳ Истекают в ближайшие 3 дня: {soon.length}</span><div style={{marginTop:6,display:"flex",gap:8,flexWrap:"wrap"}}>{soon.map((c,i)=><Badge key={i} color="amber">{rName(c.recipient_id)} · {pName(c.product_id)} до {c.due_date}</Badge>)}</div></div>}
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:20}}>{[{v:active.length,l:"Позиций",c:"var(--ink)"},{v:`${totalQty} шт`,l:"Единиц",c:"var(--gr)"},{v:som(totalVal),l:"Стоимость",c:"var(--pu)"},{v:overdue.length,l:"Просрочено",c:overdue.length?"var(--rd)":"var(--gr)"}].map((k,i)=><div key={i} className="card" style={{padding:"16px 18px",borderTop:`3px solid ${k.c}`}}><div className="ff" style={{fontSize:24,fontWeight:800,color:k.c,letterSpacing:"-.02em"}}>{k.v}</div><div style={{fontSize:11,color:"var(--tx3)",marginTop:4}}>{k.l}</div></div>)}</div>
        <div style={{display:"grid",gridTemplateColumns:"1.5fr 1fr",gap:16}}>
          <div className="card" style={{padding:0,overflow:"hidden"}}><div className="ff" style={{padding:"14px 18px",borderBottom:"1px solid var(--brd)",fontWeight:600,fontSize:15}}>Последние операции</div>{recent.length===0?<div style={{padding:32,textAlign:"center",color:"var(--tx3)",fontSize:13}}>Нет операций</div>:recent.map((m,i)=><div key={m.id} style={{display:"flex",alignItems:"center",gap:12,padding:"11px 18px",borderBottom:i<recent.length-1?"1px solid var(--brd)":"none"}}><TBadge type={m.type}/><span style={{fontWeight:500,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",fontSize:13}}>{pName(m.product_id)}</span><span className="ff" style={{fontWeight:700,color:"var(--tx2)"}}>×{m.qty}</span><span style={{fontSize:11,color:"var(--tx3)"}}>{m.recipient_id?rName(m.recipient_id):"—"}</span><span style={{fontSize:10,color:"var(--tx3)",fontFamily:"monospace"}}>{(m.created_at||"").slice(0,10)}</span></div>)}</div>
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            {lowStock.length>0&&<div className="card" style={{padding:0,overflow:"hidden"}}><div style={{padding:"12px 16px",borderBottom:"1px solid var(--brd)",display:"flex",alignItems:"center",justifyContent:"space-between"}}><span className="ff" style={{fontWeight:600,fontSize:14,color:"var(--am)"}}>📉 Заканчивается</span><Badge color="amber">{lowStock.length}</Badge></div>{lowStock.slice(0,4).map(p=><div key={p.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 16px",borderBottom:"1px solid var(--brd)",fontSize:13}}><span style={{fontWeight:500,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:130}}>{p.name}</span><Badge color={(stock[p.id]||0)===0?"red":"amber"}>{stock[p.id]||0} шт</Badge></div>)}</div>}
            <div className="card" style={{padding:0,overflow:"hidden"}}><div className="ff" style={{padding:"12px 16px",borderBottom:"1px solid var(--brd)",fontWeight:600,fontSize:14}}>По филиалам</div>{byBranch.filter(b=>b.qty>0||branches.length<=4).map((b,i)=><div key={b.id} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 16px",borderBottom:i<byBranch.length-1?"1px solid var(--brd)":"none"}}><div><div style={{fontWeight:500,fontSize:13}}>{b.name}</div><div style={{fontSize:10,color:"var(--tx3)"}}>{b.city}</div></div><div style={{textAlign:"right"}}><div className="ff" style={{fontWeight:700,fontSize:16,color:b.qty>0?"var(--ink)":"var(--tx3)"}}>{b.qty}</div><div style={{fontSize:10,color:"var(--tx3)"}}>{som(b.val)}</div></div></div>)}</div>
          </div>
        </div>
      </div>
      <Sheet open={!!sheet} onClose={()=>setSheet(null)} title={sheet?TL[sheet.type]:""} dirty={false}>
        {sheet&&<OpForm type={sheet.type} prefill={sheet.prefill} onSave={()=>{setSheet(null);toast(`${TL[sheet.type]} сохранена`)}} onCancel={()=>setSheet(null)} S={{...S,stock}}/>}
      </Sheet>
    </div>
  );
}

function ItemsView({S,stock,checkouts}){
  const{products,categories,suppliers,directions,locations,productTypes,can,toast,isRestricted,userBranchId}=S;
  const[search,setSrch]=useState("");const[catF,setCatF]=useState("all");const[mode,setMode]=useState("grid");
  const[showAdd,setAdd]=useState(false);const[sel,setSel]=useState(null);const[loading,setL]=useState(false);const fileRef=useRef(null);
  const[limit,setLimit]=useState(PAGE);
  const visible=useMemo(()=>products.filter(p=>!p.archived&&(!isRestricted||locations.find(l=>l.id===p.location_id)?.branch_id===userBranchId)),[products,isRestricted,userBranchId,locations]);
  const filtered=useMemo(()=>visible.filter(p=>(catF==="all"||p.category_id===catF)&&(!search||p.name?.toLowerCase().includes(search.toLowerCase())||(p.sku||"").toLowerCase().includes(search.toLowerCase()))),[visible,catF,search]);
  const shown=filtered.slice(0,limit);
  useEffect(()=>{setLimit(PAGE)},[search,catF,mode]);
  const[form,setForm]=useState({name:"",sku:"",category_id:"",price:"",location_id:locations[0]?.id||"",supplier_id:suppliers[0]?.id||"",product_type_id:"",direction_id:"",image_urls:"",preview_urls:[]});

  const handleFileChange=e=>{const files=Array.from(e.target.files||[]);if(!files.length)return;files.forEach(file=>{const r=new FileReader();r.onload=()=>setForm(f=>({...f,preview_urls:[...f.preview_urls,r.result]}));r.readAsDataURL(file)});};

  const save=async()=>{
    if(!form.name.trim()){toast("Укажите название","error");return}setL(true);
    let imageUrls=[];
    if(form.image_urls.trim())imageUrls=form.image_urls.split(",").map(s=>s.trim()).filter(Boolean);
    if(form.preview_urls.length)imageUrls=[...imageUrls,...form.preview_urls];
    const{error}=await sb.from("products").insert({name:form.name,sku:form.sku||null,category_id:form.category_id||null,price:Number(form.price)||0,location_id:form.location_id?Number(form.location_id):null,supplier_id:form.supplier_id?Number(form.supplier_id):null,product_type_id:form.product_type_id||null,direction_id:form.direction_id?Number(form.direction_id):null,images:imageUrls.length?JSON.stringify(imageUrls):null,archived:false});
    if(error)toast("Ошибка: "+error.message,"error");else{setAdd(false);toast("Товар добавлен");setForm({name:"",sku:"",category_id:"",price:"",location_id:locations[0]?.id||"",supplier_id:suppliers[0]?.id||"",product_type_id:"",direction_id:"",image_urls:"",preview_urls:[]})}
    setL(false);
  };

  const archiveProduct=async id=>{
    if(!window.confirm("Архивировать товар?"))return;
    const{error}=await sb.from("products").update({archived:true}).eq("id",id);
    if(error)toast("Ошибка","error");else toast("Товар архивирован");
  };

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100%"}}>
      <div style={{background:"var(--sur)",borderBottom:"1px solid var(--brd)",padding:"14px 22px",flexShrink:0}}>
        <div style={{display:"flex",gap:10,alignItems:"center",marginBottom:12}}>
          <Inp value={search} onChange={e=>setSrch(e.target.value)} placeholder="Поиск по названию или артикулу…" pfx="🔍" style={{flex:1}}/>
          <div style={{display:"flex",border:"1px solid var(--brd)",borderRadius:9,overflow:"hidden"}}>{[["grid","⊞"],["list","≡"]].map(([m,ic])=><button key={m} onClick={()=>setMode(m)} style={{padding:"7px 10px",background:mode===m?"var(--nav)":"var(--sur)",color:mode===m?"white":"var(--tx2)",fontSize:15,transition:"all .12s"}}>{ic}</button>)}</div>
          {can("edit")&&<Btn onClick={()=>setAdd(!showAdd)} icon="➕">Добавить</Btn>}
        </div>
        <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
          <button onClick={()=>setCatF("all")} style={{padding:"4px 12px",borderRadius:999,border:`1px solid ${catF==="all"?"var(--ink)":"var(--brd)"}`,fontSize:12,fontWeight:catF==="all"?600:400,background:catF==="all"?"var(--ink-l)":"var(--sur)",color:catF==="all"?"var(--ink)":"var(--tx2)",cursor:"pointer"}}>Все ({visible.length})</button>
          {categories.map(cat=>{const n=visible.filter(p=>p.category_id===cat.id||p.category_id===cat.name).length;if(!n)return null;const act=catF===cat.id||catF===cat.name;return<button key={cat.id} onClick={()=>setCatF(act?"all":cat.id)} style={{padding:"4px 12px",borderRadius:999,border:`1px solid ${act?(cat.color||"var(--ink)"):"var(--brd)"}`,fontSize:12,fontWeight:act?600:400,background:act?(cat.color||"var(--ink)")+"18":"var(--sur)",color:act?(cat.color||"var(--ink)"):"var(--tx2)",cursor:"pointer"}}>{cat.icon&&<span style={{marginRight:4}}>{cat.icon}</span>}{cat.name} ({n})</button>})}
          <span style={{marginLeft:"auto",fontSize:12,color:"var(--tx3)"}}>{filtered.length} поз. · {visible.reduce((a,p)=>a+(stock[p.id]||0),0)} шт · {som(visible.reduce((a,p)=>a+(stock[p.id]||0)*p.price,0))}</span>
        </div>
      </div>
      <div style={{flex:1,overflow:"auto",padding:20}}>
        {showAdd&&<div className="card" style={{marginBottom:18,border:"1.5px solid var(--ink)",padding:0,overflow:"hidden"}}><div style={{padding:"12px 20px",borderBottom:"1px solid var(--brd)",display:"flex",justifyContent:"space-between",alignItems:"center"}}><span className="ff" style={{fontWeight:700,fontSize:16}}>Новый товар</span><Btn v="ghost" size="sm" onClick={()=>setAdd(false)}>✕</Btn></div><div style={{padding:20}}><div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr 1fr 1fr",gap:12,marginBottom:14}}><Fld label="Название"><Inp value={form.name} onChange={e=>setForm({...form,name:e.target.value})} autoFocus/></Fld><Fld label="Артикул"><Inp value={form.sku} onChange={e=>setForm({...form,sku:e.target.value})} placeholder="SKU-001"/></Fld><Fld label="Категория"><Sel value={form.category_id} onChange={e=>setForm({...form,category_id:e.target.value})}><option value="">—</option>{categories.map(c=><option key={c.id} value={c.id}>{c.icon} {c.name}</option>)}</Sel></Fld><Fld label="Тип"><Sel value={form.product_type_id} onChange={e=>setForm({...form,product_type_id:e.target.value})}><option value="">—</option>{productTypes.map(pt=><option key={pt.id} value={pt.id}>{pt.name}</option>)}</Sel></Fld><Fld label="Цена (сом)"><Inp type="number" value={form.price} onChange={e=>setForm({...form,price:e.target.value})}/></Fld><Fld label="Место"><Sel value={form.location_id} onChange={e=>setForm({...form,location_id:e.target.value})}><option value="">—</option>{locations.map(l=><option key={l.id} value={l.id}>{l.name}</option>)}</Sel></Fld><Fld label="Поставщик"><Sel value={form.supplier_id} onChange={e=>setForm({...form,supplier_id:e.target.value})}><option value="">—</option>{suppliers.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</Sel></Fld><Fld label="Направление"><Sel value={form.direction_id} onChange={e=>setForm({...form,direction_id:e.target.value})}><option value="">—</option>{directions.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}</Sel></Fld><Fld label="Фото (URL через запятую)"><div style={{display:"flex",gap:8}}><Inp value={form.image_urls} onChange={e=>setForm({...form,image_urls:e.target.value})} placeholder="https://..."/><input type="file" accept="image/*" multiple ref={fileRef} onChange={handleFileChange} style={{display:"none"}}/><Btn size="sm" v="secondary" onClick={()=>fileRef.current?.click()}>📷</Btn></div>{form.preview_urls.length>0&&<div style={{display:"flex",gap:6,marginTop:8,flexWrap:"wrap"}}>{form.preview_urls.map((url,i)=><img key={i} src={url} style={{width:56,height:56,objectFit:"cover",borderRadius:8,border:"1px solid var(--brd)"}}/>)}</div>}</Fld></div><div style={{display:"flex",gap:8}}><Btn onClick={save} loading={loading}>Сохранить</Btn><Btn v="secondary" onClick={()=>setAdd(false)}>Отмена</Btn></div></div></div>}
        {filtered.length===0&&!showAdd&&<div style={{textAlign:"center",padding:"60px 20px",color:"var(--tx3)"}}><div className="ff" style={{fontSize:44,marginBottom:12}}>📦</div><div className="ff" style={{fontSize:18,fontWeight:600,color:"var(--tx2)",marginBottom:4}}>{search?"Ничего не найдено":"Нет товаров"}</div>{!search&&can("edit")&&<Btn onClick={()=>setAdd(true)} style={{marginTop:12}}>+ Добавить первый товар</Btn>}</div>}
        {mode==="grid"?<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(196px,1fr))",gap:14}}>{shown.map(p=><ItemCard key={p.id} p={p} stock={stock} categories={categories} checkouts={checkouts} onClick={()=>setSel(p)} onArchive={archiveProduct} canArchive={can("edit")}/>)}</div>

        {filtered.length>limit&&<div style={{display:"flex",justifyContent:"center",padding:"20px 0"}}><Btn v="secondary" onClick={()=>setLimit(l=>l+PAGE)}>Показать ещё ({filtered.length-limit})</Btn></div>}
      </div>

    </div>
  );
}

function ItemModal({p,stock,S,checkouts,onClose}){

        <div style={{padding:"16px 24px"}}><div style={{display:"flex",gap:3,padding:3,background:"var(--bg)",borderRadius:10,width:"fit-content",marginBottom:16}}>{[["info","Информация"],["history",`История${hist?` (${hist.length})`:""}`]].map(([t,l])=><button key={t} onClick={()=>setTab(t)} style={{padding:"6px 16px",borderRadius:8,border:"none",fontSize:12,fontWeight:tab===t?600:400,cursor:"pointer",background:tab===t?"var(--sur)":"transparent",color:tab===t?"var(--tx)":"var(--tx2)",boxShadow:tab===t?"var(--sh)":"none",transition:"all .12s"}}>{l}</button>)}</div>
        {tab==="info"&&<>
          {onH.length>0&&<div style={{background:"var(--ink-l)",borderRadius:12,padding:"12px 16px",marginBottom:16}}><div style={{fontSize:11,fontWeight:700,color:"var(--ink)",letterSpacing:".05em",textTransform:"uppercase",marginBottom:10}}>На руках — {onH.reduce((a,c)=>a+c.remaining,0)} шт</div>{onH.map((c,i)=>{const isOD=c.due_date&&c.due_date<TODAY;const days=c.due_date?Math.floor((new Date()-new Date(c.due_date))/864e5):null;return<div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 0",borderBottom:i<onH.length-1?"1px solid var(--brd)":"none"}}><div style={{display:"flex",alignItems:"center",gap:10}}><div style={{width:28,height:28,borderRadius:"50%",background:"var(--ink)",display:"flex",alignItems:"center",justifyContent:"center",color:"white",fontWeight:700,fontSize:12}}>{rName(c.recipient_id)[0]}</div><div><div className="ff" style={{fontSize:13,fontWeight:600}}>{rName(c.recipient_id)}</div>{c.sz&&<div style={{fontSize:10,color:"var(--tx3)"}}>СЗ: {c.sz}</div>}</div></div><div style={{display:"flex",gap:8,alignItems:"center"}}><span className="ff" style={{fontWeight:700,color:"var(--ink)"}}>{c.remaining} шт</span>{isOD?<Badge color="red">+{days}д</Badge>:c.due_date?<Badge color="green">до {c.due_date}</Badge>:null}{S.can("move")&&<Btn v="success" size="sm" onClick={()=>setConfirm({title:"Оформить возврат?",message:`Возврат ${c.remaining} шт от ${rName(c.recipient_id)}`,onOk:()=>doAction("return",c.remaining,{recipient_id:c.recipient_id,branch_id:c.branch_id,condition:"хорошее"})})}>Вернуть</Btn>}</div></div>})}</div>}

        </>}
        {tab==="history"&&<div style={{maxHeight:300,overflow:"auto"}}>{hist===null?<div style={{padding:32,textAlign:"center",color:"var(--tx3)"}}><Spin s={18}/></div>:hist.length===0?<div style={{padding:32,textAlign:"center",color:"var(--tx3)"}}>Нет операций</div>:hist.map((m,i)=><div key={m.id} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 0",borderBottom:"1px solid var(--brd)"}}><TBadge type={m.type}/><span className="ff" style={{fontWeight:600}}>×{m.qty}</span>{m.recipient_id&&<span style={{fontSize:12,color:"var(--tx2)"}}>{rName(m.recipient_id)}</span>}{m.sz&&<Badge color="ink" size="xs">{m.sz}</Badge>}<span style={{marginLeft:"auto",fontSize:11,color:"var(--tx3)",fontFamily:"monospace"}}>{(m.created_at||"").slice(0,10)}</span></div>)}</div>}
        </div>
      </div>
    </div>
  );

function ActivityView({S,checkouts,overdue}){
  const{products,recipients,suppliers,branches,can,toast,profile,isRestricted,userBranchId}=S;
  const[typeF,setTypeF]=useState("all");const[brF,setBrF]=useState("");const[search,setSrch]=useState("");const[sheet,setSheet]=useState(null);
  const[df,setDF]=useState("");const[dt,setDT]=useState(TODAY);
  const[rows,setRows]=useState([]);const[loading,setLoad]=useState(true);const[hasMore,setHasMore]=useState(false);const[page,setPage]=useState(0);
  const pName=id=>products.find(p=>p.id===id)?.name??"—";
  const rName=id=>recipients.find(r=>r.id===id)?.name??"—";

  const load=useCallback(async(pageN)=>{
    setLoad(true);
    let q=sb.from("movements").select("*").order("created_at",{ascending:false});
    if(typeF!=="all")q=q.eq("type",typeF);
    if(isRestricted){if(userBranchId)q=q.eq("branch_id",userBranchId)}
    else if(brF)q=q.eq("branch_id",Number(brF));
    if(df)q=q.gte("created_at",df);
    if(dt)q=q.lte("created_at",dt+"T23:59:59");
    q=q.range(pageN*ACT_PAGE,pageN*ACT_PAGE+ACT_PAGE-1);
    const{data,error}=await q;
    if(error)toast("Ошибка загрузки","error");
    const list=data||[];
    setRows(prev=>pageN===0?list:[...prev,...list]);
    setHasMore(list.length===ACT_PAGE);
    setLoad(false);
  },[typeF,brF,df,dt,isRestricted,userBranchId,toast]);

  useEffect(()=>{setPage(0);load(0)},[typeF,brF,df,dt,load]);

  const filtered=useMemo(()=>{
    if(!search)return rows;
    const s=search.toLowerCase();
    return rows.filter(m=>((pName(m.product_id)+(m.recipient_id?rName(m.recipient_id):"")+(m.purpose||"")+(m.sz||"")).toLowerCase().includes(s)));
  },[rows,search]);

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100%"}}>
      <div style={{background:"var(--sur)",borderBottom:"1px solid var(--brd)",padding:"14px 22px",flexShrink:0}}>

        <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:12}}><span className="ff" style={{fontSize:17,fontWeight:700}}>Движения товаров</span>{can("move")&&<div style={{marginLeft:"auto",display:"flex",gap:6}}>{[{t:"out",l:"📤 Выдать"},{t:"return",l:"🔄 Возврат"},{t:"writeoff",l:"🗑 Списать"},{t:"in",l:"📥 Приход"}].map(op=><Btn key={op.t} size="sm" v={op.t==="out"?"primary":op.t==="in"?"success":"secondary"} onClick={()=>setSheet(op.t)}>{op.l}</Btn>)}</div>}</div>
        <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
          {["all","out","in","return","writeoff"].map(t=><button key={t} onClick={()=>setTypeF(t)} style={{padding:"5px 12px",borderRadius:999,border:`1px solid ${typeF===t?"var(--ink)":"var(--brd)"}`,fontSize:12,fontWeight:typeF===t?600:400,background:typeF===t?"var(--ink-l)":"var(--sur)",color:typeF===t?"var(--ink)":"var(--tx2)",cursor:"pointer",transition:"all .12s"}}>{t==="all"?"Все":TL[t]}</button>)}
          {!isRestricted&&<Sel value={brF} onChange={e=>setBrF(e.target.value)} style={{width:150,fontSize:12}}><option value="">Все филиалы</option>{branches.map(b=><option key={b.id} value={b.id}>{b.name}</option>)}</Sel>}
          <div style={{display:"flex",gap:6,marginLeft:"auto",alignItems:"center"}}><Inp type="date" value={df} onChange={e=>setDF(e.target.value)} style={{width:128,fontSize:11}}/><span style={{color:"var(--tx3)"}}>—</span><Inp type="date" value={dt} onChange={e=>setDT(e.target.value)} style={{width:128,fontSize:11}}/><Inp value={search} onChange={e=>setSrch(e.target.value)} placeholder="Поиск на странице…" pfx="🔍" style={{width:180}}/></div>
        </div>
      </div>
      <div style={{flex:1,overflow:"auto",padding:18}}>
        <div className="card" style={{padding:0,overflow:"hidden"}}><div style={{padding:"8px 16px",borderBottom:"1px solid var(--brd)",fontSize:11,color:"var(--tx3)",display:"flex",justifyContent:"space-between"}}><span>Загружено записей: {rows.length}{search?` · показано ${filtered.length}`:""}</span>{loading&&<Spin s={12}/>}</div><table style={{width:"100%",borderCollapse:"collapse"}}><thead><tr style={{background:"var(--bg)"}}>{["Дата","Тип","Товар","Кол","Получатель","Поставщик","Филиал","СЗ","Цель"].map(h=><th key={h} style={{padding:"9px 14px",textAlign:"left",fontSize:10,fontWeight:600,color:"var(--tx3)",letterSpacing:".06em",textTransform:"uppercase",borderBottom:"1px solid var(--brd)",whiteSpace:"nowrap"}}>{h}</th>)}</tr></thead><tbody>{filtered.map((m,i)=>{const br=branches.find(b=>b.id===m.branch_id);const sup=suppliers.find(s=>s.id===m.supplier_id);return<tr key={m.id} style={{background:i%2?"var(--bg)":"var(--sur)",transition:"background .1s"}} onMouseEnter={e=>e.currentTarget.style.background="var(--ink-l)"} onMouseLeave={e=>e.currentTarget.style.background=i%2?"var(--bg)":"var(--sur)"}><td style={{padding:"10px 14px",fontFamily:"monospace",fontSize:11,color:"var(--tx3)",borderBottom:"1px solid var(--brd)",whiteSpace:"nowrap"}}>{(m.created_at||"").slice(0,10)}</td><td style={{padding:"10px 14px",borderBottom:"1px solid var(--brd)"}}><TBadge type={m.type}/></td><td style={{padding:"10px 14px",borderBottom:"1px solid var(--brd)",fontWeight:500,maxWidth:150,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{pName(m.product_id)}</td><td style={{padding:"10px 14px",borderBottom:"1px solid var(--brd)"}}><span className="ff" style={{fontWeight:700,color:"var(--tx2)"}}>×{m.qty}</span></td><td style={{padding:"10px 14px",borderBottom:"1px solid var(--brd)",color:"var(--tx2)",fontSize:12}}>{m.recipient_id?rName(m.recipient_id):"—"}</td><td style={{padding:"10px 14px",borderBottom:"1px solid var(--brd)",color:"var(--tx2)",fontSize:12}}>{sup?.name||"—"}</td><td style={{padding:"10px 14px",borderBottom:"1px solid var(--brd)",color:"var(--tx2)",fontSize:12}}>{br?`${br.name}${br.city?` (${br.city})`:""}`:"—"}</td><td style={{padding:"10px 14px",borderBottom:"1px solid var(--brd)",fontSize:11,color:"var(--ink)",fontWeight:500}}>{m.sz||"—"}</td><td style={{padding:"10px 14px",borderBottom:"1px solid var(--brd)",fontSize:12,color:"var(--tx3)",maxWidth:130,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{m.purpose||m.notes||"—"}</td></tr>})}{!loading&&filtered.length===0&&<tr><td colSpan={9} style={{padding:32,textAlign:"center",color:"var(--tx3)"}}>Нет операций</td></tr>}</tbody></table>{hasMore&&!search&&<div style={{display:"flex",justifyContent:"center",padding:"14px 0"}}><Btn v="secondary" loading={loading} onClick={()=>{const nn=page+1;setPage(nn);load(nn)}}>Загрузить ещё</Btn></div>}</div>
      </div>
      <Sheet open={!!sheet} onClose={()=>setSheet(null)} title={sheet?TL[sheet]:""} dirty={false}>
        {sheet&&<OpForm type={sheet} onSave={()=>{setSheet(null);toast(`${TL[sheet]} сохранена`);setPage(0);load(0)}} onCancel={()=>setSheet(null)} S={S}/>}
      </Sheet>
    </div>
  );
}
