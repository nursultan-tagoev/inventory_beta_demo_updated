/* ═══ УМНЫЙ АССИСТЕНТ (офлайн-движок) ═══ */
const NUM_WORDS={"ноль":0,"один":1,"одна":1,"одну":1,"два":2,"две":2,"три":3,"четыре":4,"пять":5,"шесть":6,"семь":7,"восемь":8,"девять":9,"десять":10,"одиннадцать":11,"двенадцать":12,"тринадцать":13,"четырнадцать":14,"пятнадцать":15,"шестнадцать":16,"семнадцать":17,"восемнадцать":18,"девятнадцать":19,"двадцать":20,"тридцать":30,"сорок":40,"пятьдесят":50,"шестьдесят":60,"семьдесят":70,"восемьдесят":80,"девяносто":90,"сто":100,"двести":200,"триста":300,"пара":2,"пару":2,"десяток":10,"дюжина":12,"дюжину":12};
const norm=s=>(s||"").toLowerCase().replace(/ё/g,"е").replace(/[.,!?;:]/g,"").trim();
function lev(a,b){const m=a.length,nn=b.length;if(!m)return nn;if(!nn)return m;const d=[];for(let i=0;i<=m;i++)d[i]=[i];for(let j=0;j<=nn;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=nn;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][nn]}
function parseQtyRu(low){
  const d=low.match(/\b(\d+)\b/);if(d)return parseInt(d[1]);
  let total=0,found=false;
  norm(low).split(/\s+/).forEach(w=>{if(NUM_WORDS[w]!=null){total+=NUM_WORDS[w];found=true}});
  return found?total:null;
}
function commonPref(a,b){let i=0;const n=Math.min(a.length,b.length);while(i<n&&a[i]===b[i])i++;return i}
function matchEntity(input,items,nameKey){
  nameKey=nameKey||"name";
  const words=norm(input).split(/\s+/).filter(w=>w.length>2);
  const full=norm(input);
  let best=null,bestScore=0,second=0;
  items.forEach(it=>{
    const nm=norm(it[nameKey]);if(!nm)return;
    const nToks=nm.split(/\s+/).filter(w=>w.length>2);
    let score=0;
    nToks.forEach(nt=>words.forEach(w=>{
      if(w===nt){score+=3;return}
      const cp=commonPref(w,nt),ml=Math.min(w.length,nt.length),Ml=Math.max(w.length,nt.length);
      if(cp>=5||(cp>=4&&ml<=6)||(cp>=3&&ml<=5)){score+=2.5;return}          // склонение: общий корень
      if(Ml>=4&&lev(w,nt)<=Math.max(1,Math.round(Ml/3))){score+=2;return}   // опечатка/форма
      if(w.length>3&&(w.includes(nt)||nt.includes(w))){score+=2}
    }));
    if(nm.length>2&&full.includes(nm))score+=4;
    if(score>bestScore){second=bestScore;bestScore=score;best=it}
    else if(score>second)second=score;
  });
  return{item:bestScore>=2?best:null,strong:bestScore>=2&&(bestScore-second>=1.5||bestScore>=4),score:bestScore};
}
function parseDue(low){
  const l=norm(low);
  const iso=d=>new Date(Date.now()+d*864e5).toISOString().slice(0,10);
  if(l.includes("послезавтра"))return iso(2);
  if(l.includes("завтра"))return iso(1);
  const via=l.match(/через (\d+) (день|дня|дней|неделю|недели|недель)/);
  if(via)return iso(/недел/.test(via[2])?parseInt(via[1])*7:parseInt(via[1]));
  const WD={"понедельник":1,"вторник":2,"среду":3,"среда":3,"четверг":4,"пятницу":5,"пятница":5,"субботу":6,"суббота":6,"воскресенье":0};
  for(const w in WD){if(l.includes(w)){const now=new Date();let diff=(WD[w]-now.getDay()+7)%7;if(diff===0)diff=7;return iso(diff)}}
  const m=l.match(/(\d{4}-\d{2}-\d{2})/);if(m)return m[1];
  return null;
}
function detectNav(low){
  const l=norm(low);
  if(!/(открой|покажи|перейди|зайди|открыть|показать)/.test(l))return null;
  const map=[["отчет","reports"],["товар","items"],["каталог","items"],["движен","activity"],["филиал","branches"],["получател","recipients"],["справочник","settings"],["поставщик","suppliers"],["главн","home"],["пользовател","users"]];
  for(const[k,v]of map)if(l.includes(k))return v;
  return null;
}

function AssistantView({S,stock,checkouts,setView,autostart,onAutostart}){
  const{products,recipients,suppliers,branches,flows,profile,can,toast}=S;
  const CHAT_KEY="mkt_assist_chat_v1";
  const INTRO="Здравствуйте! Я голосовой помощник склада. Скажите или напишите, что нужно: «выдай Айгерим 5 футболок», «прими 100 ручек», «сколько блокнотов», «что просрочено», «что у Айгерим». Включите «Руки свободны» и позовите «Эй, склад».";
  const[messages,setMessages]=useState(()=>{try{const s=JSON.parse(localStorage.getItem(CHAT_KEY));if(Array.isArray(s)&&s.length)return s}catch(e){}return[{id:0,from:"system",text:INTRO}]});
  const[input,setInput]=useState("");
  const[vstate,setVstate]=useState("off"); // off | idle | listening | speaking
  const[hf,setHf]=useState(false);
  const[tts,setTts]=useState(true);
  const[pending,setPending]=useState(null);
  const[micOK,setMicOK]=useState(true);
  const endRef=useRef(null);const idRef=useRef(messages.reduce((m,x)=>Math.max(m,x.id||0),0)+1);const ctx=useRef({product:null,recipient:null});
  useEffect(()=>{try{localStorage.setItem(CHAT_KEY,JSON.stringify(messages.slice(-60)))}catch(e){}},[messages]);
  const recRef=useRef(null);const modeRef=useRef("off");const hfRef=useRef(false);
  const pendingRef=useRef(null);const cmdTimer=useRef(null);const voiceRef=useRef(null);
  const speakingRef=useRef(false);const ttsRef=useRef(true);const voiceReplyRef=useRef(false);
  const handleRef=useRef(null);const startingRef=useRef(false);

  useEffect(()=>{pendingRef.current=pending},[pending]);
  useEffect(()=>{ttsRef.current=tts},[tts]);
  useEffect(()=>{endRef.current?.scrollIntoView({behavior:"smooth"})},[messages,pending]);
  useEffect(()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)setMicOK(false)},[]);
  useEffect(()=>()=>{hfRef.current=false;try{recRef.current&&recRef.current.stop()}catch(e){}window.speechSynthesis&&window.speechSynthesis.cancel()},[]);

  useEffect(()=>{
    if(!window.speechSynthesis)return;
    const pick=()=>{
      const vs=window.speechSynthesis.getVoices();
      voiceRef.current=vs.find(v=>/ru/i.test(v.lang)&&/tatyana|татьяна|alena|алёна|алена|milena|милена|katya|катя|female|женск/i.test(v.name))
        ||vs.find(v=>/ru/i.test(v.lang)&&/google/i.test(v.name))
        ||vs.find(v=>/ru[-_]?RU/i.test(v.lang))||vs.find(v=>/^ru/i.test(v.lang))||null;
    };
    pick();window.speechSynthesis.onvoiceschanged=pick;
  },[]);

  const push=(from,text,node)=>setMessages(m=>[...m,{id:idRef.current++,from,text,node}]);

  const speak=(text,onEnd)=>{
    if(!(ttsRef.current||voiceReplyRef.current)||!window.speechSynthesis){onEnd&&onEnd();return}
    window.speechSynthesis.cancel();
    const spoken=(text||"").replace(/\bшт\b\.?/g,"штук").replace(/[×✕]/g," по ").replace(/[•]/g,"").replace(/₸/g,"сом");
    const u=new SpeechSynthesisUtterance(spoken);
    u.lang="ru-RU";if(voiceRef.current)u.voice=voiceRef.current;
    u.rate=0.94;u.pitch=1.06;u.volume=1;
    speakingRef.current=true;setVstate("speaking");
    const done=()=>{speakingRef.current=false;setVstate(hfRef.current?"listening":"off");onEnd&&onEnd()};
    u.onend=done;u.onerror=done;
    window.speechSynthesis.speak(u);
  };
  const say=(t,listenAfter)=>{push("system",t);speak(t,()=>{if(listenAfter){if(hfRef.current)armListen(false);else if(micOK&&voiceReplyRef.current)startOnce()}})};

  const armListen=(announce)=>{
    modeRef.current="wake";setVstate("listening");
    clearTimeout(cmdTimer.current);
    cmdTimer.current=setTimeout(()=>{if(modeRef.current==="wake"){modeRef.current="idle"}},11000);
    if(announce)speak("Слушаю");
  };

  const REQ={out:["product","recipient","qty"],in:["product","qty"],return:["product","recipient","qty"],writeoff:["product","qty"]};
  const slotAsk={product:"Какой товар?",recipient:"Кому или от кого? Назовите имя.",qty:"Сколько штук?"};
  const pName=id=>products.find(p=>p.id===id)?.name??"—";
  const rName=id=>recipients.find(r=>r.id===id)?.name??"—";

  const extract=(low,base)=>{
    const a={...base};
    const pm=matchEntity(low,products.filter(p=>!p.archived));
    if(pm.item&&pm.strong){a.product_id=pm.item.id;a.product_name=pm.item.name;ctx.current.product=pm.item.id}
    else if(pm.item){a._pguess=pm.item}
    const rm=matchEntity(low,recipients);
    if(rm.item){a.recipient_id=rm.item.id;a.recipient_name=rm.item.name;ctx.current.recipient=rm.item.id}
    const q=parseQtyRu(low);if(q!=null)a.qty=q;
    if(a.type==="in"){const sm=matchEntity(low,suppliers);if(sm.item)a.supplier_id=sm.item.id}
    if(a.type==="out"){const due=parseDue(low);if(due)a.due_date=due;const pm2=low.match(/на ([а-яa-z0-9 ]{3,40})/i);if(pm2&&!/на руках/.test(pm2[1]))a.purpose=pm2[1].trim();const sz=low.match(/сз[-\s]?(\S+)/i);if(sz)a.sz=sz[0]}
    return a;
  };
  const missingOf=a=>REQ[a.type].filter(s=>s==="product"?!a.product_id:s==="recipient"?!a.recipient_id:!a.qty);

  const proceed=a=>{
    const miss=missingOf(a);
    if(miss.length){const slot=miss[0];setPending({kind:"slot",action:a,awaiting:slot});say(slotAsk[slot],true);return}
    setPending({kind:"confirm",action:a});
    const sum=`${TL[a.type]}: ${a.qty} шт «${a.product_name||pName(a.product_id)}»${a.recipient_id?(a.type==="return"?" от ":" → ")+(a.recipient_name||rName(a.recipient_id)):""}${a.purpose?" · "+a.purpose:""}${a.due_date?" · до "+a.due_date:""}`;
    push("system","Проверьте и подтвердите:",{type:"confirm",summary:sum});
    speak(`Подтвердить? ${TL[a.type]} ${a.qty} штук ${a.product_name||pName(a.product_id)}. Скажите «да» или «нет».`,()=>{if(hfRef.current)armListen(false);else if(micOK&&voiceReplyRef.current)startOnce()});
  };

  const execute=async a=>{
    const avail=(stock&&stock[a.product_id])||0;
    if((a.type==="out"||a.type==="writeoff")&&a.qty>avail){setPending(null);say(`Недостаточно на складе: доступно ${avail} шт. Операция отменена.`);return}
    setPending(null);
    const prod=products.find(p=>p.id===a.product_id);
    const rec=recipients.find(r=>r.id===a.recipient_id);
    const{error}=await sb.from("movements").insert({
      type:a.type,product_id:a.product_id,qty:a.qty,location_id:prod?.location_id||null,issuer_id:profile.id,
      recipient_id:a.recipient_id||null,branch_id:a.branch_id||rec?.branch_id||null,
      supplier_id:a.type==="in"?(a.supplier_id||prod?.supplier_id||null):null,
      purpose:a.type==="out"?(a.purpose||null):null,due_date:a.type==="out"?(a.due_date||null):null,sz:a.type==="out"?(a.sz||null):null,
      condition:a.type==="return"?"хорошее":null
    });
    if(error){say("Не удалось сохранить: "+error.message)}
    else{push("system",`Готово! ${TL[a.type]} — ${a.qty} шт «${pName(a.product_id)}» сохранена.`);speak("Готово, операция сохранена.")}
  };

  const createProduct=async name=>{
    const{data,error}=await sb.from("products").insert({name,archived:false}).select().single();
    if(error){say("Ошибка создания: "+error.message);return null}
    say(`Товар «${name}» создан.`);return data;
  };
  const createRecipient=async raw=>{
    const nm=(raw||"").trim().replace(/^(для|кому|получатель|это)\s+/i,"").trim();
    if(!nm)return null;
    const{data,error}=await sb.from("recipients").insert({name:nm}).select().single();
    if(error){say("Не удалось добавить получателя: "+error.message);return null}
    say(`Получатель «${nm}» добавлен.`);return data;
  };

  const llmCfg=()=>{try{return JSON.parse(localStorage.getItem("mkt_llm"))}catch(e){return null}};
  const setupLLM=()=>{
    const cur=llmCfg()||{};
    const key=window.prompt("Ключ ИИ (OpenAI-совместимый, напр. OpenRouter). Хранится только в этом браузере:",cur.key||"");
    if(key===null)return;
    const url=window.prompt("URL эндпоинта (Enter — OpenRouter по умолчанию):",cur.url||"https://openrouter.ai/api/v1/chat/completions")||"https://openrouter.ai/api/v1/chat/completions";
    const model=window.prompt("Модель:",cur.model||"openai/gpt-4o-mini")||"openai/gpt-4o-mini";
    localStorage.setItem("mkt_llm",JSON.stringify({key:key.trim(),url:url.trim(),model:model.trim()}));
    say("ИИ подключён. Теперь можно спрашивать что угодно.",true);
  };
  const askLLM=async(q)=>{
    if(navigator.onLine===false){say("Сейчас нет сети — на общие вопросы отвечу при подключении. По складу помогу и офлайн.",true);return}
    const cfg=llmCfg();
    if(!cfg||!cfg.key){say("Чтобы отвечать на любые вопросы (хоть про галактику, хоть посоветоваться), подключите ИИ: нажмите ⚙ вверху и вставьте ключ. Пока помогаю по складу: остатки, приход, выдача, возврат, списание, просрочки.",true);return}
    const id=idRef.current++;setMessages(m=>[...m,{id,from:"system",text:"…думаю"}]);
    try{
      const r=await fetch(cfg.url,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+cfg.key},
        body:JSON.stringify({model:cfg.model,messages:[
          {role:"system",content:"Ты — дружелюбный голосовой помощник складского учёта банка. Отвечай кратко, по-русски, живым тоном. Помогаешь и по складу, и на общие вопросы (наука, советы и т.п.). Ответы для озвучивания — без разметки."},
          {role:"user",content:q}]})});
      const d=await r.json();
      const t=(d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||(d.error&&d.error.message)||"Не удалось получить ответ.";
      setMessages(m=>m.map(x=>x.id===id?{...x,text:t}:x));
      speak(t,()=>{if(hfRef.current)armListen(false);else if(micOK&&voiceReplyRef.current)startOnce()});
    }catch(e){
      setMessages(m=>m.map(x=>x.id===id?{...x,text:"Не получилось связаться с ИИ: "+(e.message||e)+". Проверьте ключ, URL и что эндпоинт разрешает запросы из браузера (CORS)."}:x));
    }
  };

  const answerQuery=(intent,low)=>{
    if(intent==="q_inventory"){const act=products.filter(p=>!p.archived).map(p=>({p,q:stock[p.id]||0})).sort((a,b)=>b.q-a.q);const have=act.filter(x=>x.q>0);if(!have.length){say("На складе пока пусто — нет остатков. Оформите приход.",true);return}const tot=have.reduce((a,x)=>a+x.q,0);push("system","На складе:\n"+have.slice(0,20).map(x=>`• ${x.p.name}: ${x.q} шт`).join("\n")+(have.length>20?`\n…и ещё ${have.length-20}`:""));say(`На складе ${have.length} позиций, всего ${tot} штук. Показала список.`,true);return}
    if(intent==="q_stock"){const pm=matchEntity(low,products.filter(p=>!p.archived));if(!pm.item){say("Не нашла такой товар. Уточните название.",true);return}const q=stock[pm.item.id]||0;say(`«${pm.item.name}»: ${q} шт на складе${q<5?" — заканчивается":""}.`,true)}
    else if(intent==="q_overdue"){const od=checkouts.filter(c=>c.due_date&&c.due_date<TODAY);if(!od.length){say("Просроченных выдач нет.");return}push("system",`Просрочено ${od.length}:\n`+od.slice(0,12).map(c=>`• ${rName(c.recipient_id)} — ${pName(c.product_id)} ×${c.remaining} (с ${c.due_date})`).join("\n"));speak(`Просрочено ${od.length} выдач.`)}
    else if(intent==="q_low"){const lw=products.filter(p=>!p.archived&&(stock[p.id]||0)<5);if(!lw.length){say("Всё в достатке, ничего не заканчивается.");return}push("system","Заканчивается:\n"+lw.slice(0,15).map(p=>`• ${p.name}: ${stock[p.id]||0} шт`).join("\n"));speak(`Заканчивается ${lw.length} позиций.`)}
    else if(intent==="q_top"){const rank=products.filter(p=>!p.archived).map(p=>({p,out:(flows[p.id]||{}).out_q||0})).filter(x=>x.out>0).sort((a,b)=>b.out-a.out).slice(0,10);if(!rank.length){say("Ещё нет выдач для рейтинга.");return}push("system","Больше всего выдано:\n"+rank.map((x,i)=>`${i+1}. ${x.p.name} — ${x.out} шт`).join("\n"));speak("Показываю топ выдач.")}
    else if(intent==="q_holder"){const rm=matchEntity(low,recipients);if(!rm.item){say("Не нашёл получателя. Уточните имя.");return}const hold=checkouts.filter(c=>c.recipient_id===rm.item.id);if(!hold.length){say(`У «${rm.item.name}» ничего не числится на руках.`);return}push("system",`На руках у ${rm.item.name}:\n`+hold.map(c=>`• ${pName(c.product_id)} ×${c.remaining}${c.due_date?" (до "+c.due_date+")":""}`).join("\n"));speak(`Показываю, что взял ${rm.item.name}.`)}
    else if(intent==="q_value"){const active=products.filter(p=>!p.archived);const val=active.reduce((a,p)=>a+(stock[p.id]||0)*p.price,0);const qty=active.reduce((a,p)=>a+(stock[p.id]||0),0);say(`На складе ${active.length} позиций, ${qty} штук, общая стоимость ${fmt(val)} сом.`)}
  };

  const handleText=async(raw,spoken)=>{
    const text=(raw||"").trim();if(!text)return;
    voiceReplyRef.current=!!spoken;
    push("user",text);setInput("");
    const low=text.toLowerCase();
    const pend=pendingRef.current;

    if(pend){
      const YES=/^(да|ага|угу|верно|точно|правильно|это оно|подтверждаю|подтверди|хорошо|ок|окей|давай|конечно|создай|создать|yes|сохрани)/;
      const NO=/^(нет|неа|отмена|отмени|стоп|не надо|не нужно|не то|отставить|no)/;
      if(pend.kind==="confirm"){
        if(YES.test(norm(low))){execute(pend.action);return}
        if(NO.test(norm(low))){setPending(null);say("Операция отменена.",true);return}
        say("Скажите «да» для подтверждения или «нет» для отмены.",true);return;
      }
      if(pend.kind==="guess"){
        const a={...pend.action};delete a._pguess;
        if(YES.test(norm(low))){a.product_id=pend.guess.id;a.product_name=pend.guess.name;setPending(null);proceed(a);return}
        const pm=matchEntity(low,products.filter(p=>!p.archived));
        if(pm.item&&pm.strong){a.product_id=pm.item.id;a.product_name=pm.item.name;setPending(null);proceed(a);return}
        if(pm.item){setPending({kind:"guess",action:a,guess:pm.item});say(`Тогда «${pm.item.name}»? Скажите «да» или назовите иначе.`,true);return}
        setPending({kind:"create",action:a,pname:text.trim()});say(`Не нашла такой товар. Создать новый — «${text.trim()}»? Скажите «да» или «нет».`,true);return;
      }
      if(pend.kind==="create"){
        const a={...pend.action};
        if(NO.test(norm(low))){setPending({kind:"slot",action:a,awaiting:"product"});say("Хорошо, не создаю. Назовите товар ещё раз.",true);return}
        if(YES.test(norm(low))){const cp=await createProduct(pend.pname);if(cp){a.product_id=cp.id;a.product_name=cp.name;setPending(null);proceed(a)}return}
        const pm=matchEntity(low,products.filter(p=>!p.archived));
        if(pm.item&&pm.strong){a.product_id=pm.item.id;a.product_name=pm.item.name;setPending(null);proceed(a);return}
        setPending({kind:"create",action:a,pname:text.trim()});say(`Создать новый товар «${text.trim()}»? Скажите «да» или «нет».`,true);return;
      }
      if(pend.kind==="create_rec"){
        const a={...pend.action};
        if(NO.test(norm(low))){setPending({kind:"slot",action:a,awaiting:"recipient"});say("Хорошо. Назовите получателя ещё раз.",true);return}
        if(YES.test(norm(low))){const nr=await createRecipient(pend.rname);if(nr){a.recipient_id=nr.id;a.recipient_name=nr.name;setPending(null);proceed(a)}return}
        const rm=matchEntity(low,recipients);
        if(rm.item){a.recipient_id=rm.item.id;a.recipient_name=rm.item.name;setPending(null);proceed(a);return}
        setPending({kind:"create_rec",action:a,rname:text.trim()});say(`Добавить получателя «${text.trim()}»? Скажите «да» или «нет».`,true);return;
      }
      if(pend.kind==="slot"){
        const a={...pend.action};const slot=pend.awaiting;
        if(slot==="product"){
          const pm=matchEntity(low,products.filter(p=>!p.archived));
          if(pm.item&&pm.strong){a.product_id=pm.item.id;a.product_name=pm.item.name}
          else if(pm.item){setPending({kind:"guess",action:a,guess:pm.item});say(`Вы имели в виду «${pm.item.name}»? Скажите «да» или назовите точнее.`,true);return}
          else{setPending({kind:"create",action:a,pname:text.trim()});say(`Не нашла товар «${text.trim()}». Создать новый? Скажите «да» или «нет».`,true);return}
        }
        else if(slot==="recipient"){
          const rm=matchEntity(low,recipients);
          if(rm.item){a.recipient_id=rm.item.id;a.recipient_name=rm.item.name}
          else{setPending({kind:"create_rec",action:a,rname:text.trim()});say(`Не нашла получателя «${text.trim()}». Добавить нового? Скажите «да» или «нет».`,true);return}
        }
        else if(slot==="qty"){const q=parseQtyRu(low);if(q==null){say("Не расслышала количество. Назовите число, например «пять».",true);return}a.qty=q}
        setPending(null);proceed(a);return;
      }
    }

    const nav=detectNav(low);
    if(nav){setView(nav);say("Открываю раздел.");return}

    if(/(что ты умеешь|помощь|команды|help|подскажи что)/.test(low)){
      push("system","Я умею:\n📤 «выдай Айгерим 5 футболок на конференцию»\n📥 «прими 100 ручек от Поставщик 1»\n🔄 «возврат от Бакыта 3 блокнота»\n🗑 «спиши 2 кружки»\n📊 «сколько блокнотов», «что просрочено», «что заканчивается», «топ выдач», «что у Айгерим»\n🧭 «открой отчёты», «покажи товары»\n🎙 Голосом: включите «Руки свободны» и скажите «Эй, склад …».");
      speak("Могу оформлять выдачи, приходы, возвраты и списания, показывать остатки и просрочки. Включите режим «Руки свободны» и позовите «Эй, склад».");
      return;
    }
    if(/(спасибо|благодар)/.test(low)){say("Всегда рад помочь!");return}
    if(/^(привет|здравствуй|салам|добр|эй)/.test(norm(low))&&low.length<20){say("Здравствуйте! Что оформить — выдачу, приход, или показать остатки?",true);return}

    if(/(что (есть )?на складе|что на складе|весь склад|список товаров|покажи товары|какие товары|инвентар|остатки по всем|что имеется)/.test(low)&&!/(выдай|прими|спиши|возврат)/.test(low)){answerQuery("q_inventory",low);return}
    if(/(сколько|остаток|остатки|есть ли|в наличии)/.test(low)&&!/(выдай|прими|спиши|возврат)/.test(low)){answerQuery("q_stock",low);return}
    if(/(просроч|должник|кто не вернул)/.test(low)){answerQuery("q_overdue",low);return}
    if(/(заканчива|мало на складе|заканчиваются|низкий остаток)/.test(low)){answerQuery("q_low",low);return}
    if(/(топ|популярн|больше всего выда|рейтинг)/.test(low)){answerQuery("q_top",low);return}
    if(/(что у |что взял|на руках у|числится за)/.test(low)){answerQuery("q_holder",low);return}
    if(/(стоимость склада|общая стоимость|сколько всего на складе|склад стоит|на какую сумму)/.test(low)){answerQuery("q_value",low);return}

    let type=null;
    if(/(выдай|выдать|выдач|дай|отправь|передай)/.test(low))type="out";
    else if(/(прими|приход|приня|поступил|завоз|привезл|закуп|поставк)/.test(low))type="in";
    else if(/(возврат|верни|вернул|вернуть|сдал|сдать)/.test(low))type="return";
    else if(/(спиши|списан|списать|брак|испорч|утил)/.test(low))type="writeoff";

    if(!type){
      if(!can("move")&&/(выдай|прими|спиши|возврат)/.test(low)){say("У вас нет прав на операции — только просмотр.");return}
      askLLM(text);return;
    }
    if(!can("move")){say("У вас нет прав на операции — только просмотр.");return}

    const a=extract(low,{type});
    if(!a.product_id&&a._pguess){setPending({kind:"guess",action:a,guess:a._pguess});say(`Вы имели в виду «${a._pguess.name}»? Скажите «да» или назовите товар точнее.`,true);return}
    proceed(a);
  };
  handleRef.current=handleText;

  const detectWake=(low)=>{
    const m=low.match(/(?:^|\s)(?:эй|окей|ок|привет|слушай|hey)?[,\s]*склад[а-я]*[,.!?\s]*(.*)$/i);
    if(m&&(/(?:эй|окей|ок|привет|слушай|hey)/.test(low)||low.trim().startsWith("склад"))){
      return{hit:true,rest:(m[1]||"").trim()};
    }
    return{hit:false,rest:""};
  };

  const routeVoice=(transcript)=>{
    if(speakingRef.current)return;
    const low=norm(transcript);
    if(modeRef.current==="wake"){
      clearTimeout(cmdTimer.current);modeRef.current="idle";
      handleRef.current&&handleRef.current(transcript,true);
      return;
    }
    const w=detectWake(low);
    if(w.hit){
      if(w.rest&&w.rest.length>2){modeRef.current="idle";handleRef.current&&handleRef.current(w.rest,true);}
      else armListen(true);
    }
  };

  const startRec=()=>{
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){setMicOK(false);return}
    if(startingRef.current)return;startingRef.current=true;
    try{recRef.current&&recRef.current.stop()}catch(e){}
    const r=new SR();r.lang="ru-RU";r.continuous=true;r.interimResults=false;
    r.onresult=e=>{const res=e.results[e.results.length-1];if(res&&res.isFinal)routeVoice(res[0].transcript)};
    r.onerror=e=>{
      startingRef.current=false;
      if(e.error==="not-allowed"||e.error==="service-not-allowed"){toast("Нет доступа к микрофону","error");stopHandsFree()}
    };
    r.onend=()=>{startingRef.current=false;if(hfRef.current)setTimeout(()=>{if(hfRef.current)startRec()},120)};
    recRef.current=r;
    try{r.start()}catch(e){startingRef.current=false}
  };

  const startHandsFree=()=>{
    if(!micOK){toast("Голосовой ввод доступен в Chrome/Edge","warn");return}
    hfRef.current=true;setHf(true);modeRef.current="idle";setVstate("listening");
    setTts(true);ttsRef.current=true;
    startRec();
    say("Режим «Руки свободны» включён. Позовите: «Эй, склад».");
  };
  const stopHandsFree=()=>{
    hfRef.current=false;setHf(false);modeRef.current="off";setVstate("off");
    clearTimeout(cmdTimer.current);
    try{recRef.current&&recRef.current.stop()}catch(e){}
    window.speechSynthesis&&window.speechSynthesis.cancel();speakingRef.current=false;
  };

  useEffect(()=>{if(autostart){setTimeout(()=>{try{startOnce()}catch(e){}},350);onAutostart&&onAutostart()}},[]);
  const startOnce=()=>{
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){toast("Голосовой ввод доступен в Chrome/Edge","warn");return}
    const r=new SR();r.lang="ru-RU";r.interimResults=false;
    setVstate("listening");
    r.onresult=e=>{handleRef.current&&handleRef.current(e.results[0][0].transcript,true);if(!hfRef.current)setVstate("off")};
    r.onerror=()=>{if(!hfRef.current)setVstate("off")};r.onend=()=>{if(!hfRef.current&&!speakingRef.current)setVstate("off")};
    try{r.start()}catch(e){}
  };

  const QUICK=["Что просрочено","Что заканчивается","Топ выдач","Стоимость склада"];
  const STATE_UI={
    off:{c:"var(--tx3)",bg:"var(--bg)",t:"Микрофон выключен"},
    idle:{c:"var(--ink)",bg:"var(--ink-l)",t:"Жду «Эй, склад»…"},
    listening:{c:"var(--gr-m)",bg:"var(--gr-l)",t:modeRef.current==="wake"?"Слушаю команду…":"Жду «Эй, склад»…"},
    speaking:{c:"var(--pu)",bg:"var(--pu-l)",t:"Отвечаю…"},
  }[vstate]||{c:"var(--tx3)",bg:"var(--bg)",t:""};

  return(
    <div style={{height:"100%",display:"flex",flexDirection:"column",background:"var(--bg)"}}>
      <div style={{background:"var(--sur)",borderBottom:"1px solid var(--brd)",padding:"14px 22px",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,flexWrap:"wrap"}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}><span style={{fontSize:20}}>🎙</span><div><span className="ff" style={{fontSize:17,fontWeight:700}}>Люси</span><div style={{fontSize:11,color:"var(--tx3)"}}>голосовой помощник склада · операции, аналитика, навигация</div></div></div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          {hf&&<span style={{display:"inline-flex",alignItems:"center",gap:6,padding:"4px 10px",borderRadius:999,background:STATE_UI.bg,color:STATE_UI.c,fontSize:12,fontWeight:600}}><span style={{width:8,height:8,borderRadius:"50%",background:STATE_UI.c,animation:vstate==="listening"||vstate==="speaking"?"pulse 1.2s infinite":"none"}}/>{STATE_UI.t}</span>}
          <button onClick={setupLLM} title="Подключить ИИ для любых вопросов" style={{display:"flex",alignItems:"center",gap:6,padding:"6px 12px",borderRadius:20,border:"1px solid var(--brd)",background:"var(--sur)",color:"var(--tx2)",fontSize:12,fontWeight:600,cursor:"pointer"}}>⚙ ИИ</button>
          <button onClick={()=>setTts(t=>!t)} style={{display:"flex",alignItems:"center",gap:6,padding:"6px 12px",borderRadius:20,border:`1px solid ${tts?"var(--ink)":"var(--brd)"}`,background:tts?"var(--ink-l)":"var(--sur)",color:tts?"var(--ink)":"var(--tx2)",fontSize:12,fontWeight:600,cursor:"pointer"}}>{tts?"🔊 Голос вкл":"🔈 Голос выкл"}</button>
          <button onClick={()=>hf?stopHandsFree():startHandsFree()} style={{display:"flex",alignItems:"center",gap:6,padding:"6px 14px",borderRadius:20,border:`1px solid ${hf?"var(--gr)":"var(--brd)"}`,background:hf?"var(--gr-l)":"var(--sur)",color:hf?"var(--gr-m)":"var(--tx2)",fontSize:12,fontWeight:700,cursor:"pointer"}}>{hf?"🟢 Руки свободны":"🎧 Руки свободны"}</button>
        </div>
      </div>
      <div style={{flex:1,overflow:"auto",padding:"20px 22px"}}>
        <div style={{maxWidth:720,margin:"0 auto"}}>
        {messages.map(msg=>(
          <div key={msg.id} style={{marginBottom:12,display:"flex",justifyContent:msg.from==="user"?"flex-end":"flex-start"}}>
            <div style={{maxWidth:"80%",padding:"11px 15px",borderRadius:16,background:msg.from==="user"?"var(--ink)":"var(--sur)",color:msg.from==="user"?"white":"var(--tx)",boxShadow:"var(--sh)",fontSize:13,lineHeight:1.55,whiteSpace:"pre-line",border:msg.from==="user"?"none":"1px solid var(--brd)"}}>
              {msg.text}
              {msg.node?.type==="confirm"&&pending?.kind==="confirm"&&(
                <div style={{marginTop:10,padding:"12px 14px",background:"var(--bg)",borderRadius:12,border:"1px solid var(--brd)"}}>
                  <div className="ff" style={{fontWeight:700,fontSize:13,color:TC[pending.action.type],marginBottom:10}}>{msg.node.summary}</div>
                  <div style={{display:"flex",gap:8}}><Btn size="sm" onClick={()=>execute(pending.action)}>✓ Подтвердить</Btn><Btn size="sm" v="secondary" onClick={()=>{setPending(null);push("system","Отменено.")}}>Отмена</Btn></div>
                </div>
              )}
            </div>
          </div>
        ))}
        <div ref={endRef}/>
        </div>
      </div>
      <div style={{padding:"12px 22px 8px",background:"var(--sur)",borderTop:"1px solid var(--brd)"}}>
        <div style={{maxWidth:720,margin:"0 auto"}}>
          <div style={{display:"flex",gap:6,marginBottom:8,flexWrap:"wrap"}}>{QUICK.map(q=><button key={q} onClick={()=>handleText(q,false)} style={{padding:"4px 12px",borderRadius:999,border:"1px solid var(--brd)",background:"var(--bg)",fontSize:12,color:"var(--tx2)",cursor:"pointer"}}>{q}</button>)}</div>
          <div style={{display:"flex",gap:8}}>
            <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&input.trim())handleText(input,false)}} placeholder="Напишите команду или нажмите 🎤…" style={{flex:1,padding:"11px 15px",border:"1px solid var(--brd)",borderRadius:11,fontSize:13,background:"var(--bg)"}}/>
            <Btn onClick={()=>input.trim()&&handleText(input,false)} disabled={!input.trim()}>→</Btn>
            <Btn onClick={startOnce} v={vstate==="listening"&&!hf?"danger":"secondary"}>{vstate==="listening"&&!hf?"🔴":"🎤"}</Btn>
          </div>
          {!micOK&&<div style={{fontSize:11,color:"var(--tx3)",marginTop:6}}>Голосовой ввод доступен в браузерах Chrome и Edge при наличии интернета. Текстовый режим работает везде.</div>}
        </div>
      </div>
    </div>
  );
}

/* ═══ ВХОД ═══ */
function Login({onLogin}){
  const[email,setEmail]=useState("");const[pass,setPass]=useState("");
  const[loading,setL]=useState(false);const[err,setErr]=useState("");
  const[net,setNet]=useState("");const[checking,setChecking]=useState(false);
  const[th,setTh]=useState((typeof document!=="undefined"&&document.documentElement.getAttribute("data-theme"))||"light");
  const flipTheme=()=>{const n=th==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",n);try{localStorage.setItem("mkt_theme",n)}catch(e){}setTh(n)};
  const NETMSG="Нет связи с сервером (Failed to fetch). Это не про пароль. Проверьте: проект Supabase не на паузе (Dashboard → Resume), открыт по https (не file://), не блокирует firewall/VPN/адблок, есть интернет.";
  const submit=async()=>{
    if(!email||!pass){setErr("Заполните все поля");return}
    setL(true);setErr("");setNet("");
    try{
      const{data,error}=await sb.auth.signInWithPassword({email,password:pass});
      if(error){setErr(error.message==="Invalid login credentials"?"Неверный email или пароль":error.message);setL(false);return}
      onLogin(data.user);
    }catch(e){
      setL(false);
      setErr((e&&/fetch/i.test(e.message||""))?NETMSG:("Ошибка входа: "+(e&&e.message||e)));
    }
  };
  const checkConn=async()=>{
    setChecking(true);setNet("");setErr("");
    try{
      const r=await fetch(SB_URL+"/auth/v1/health",{headers:{apikey:SB_KEY}});
      setNet(r.ok?"ok:Сервер отвечает ✓ Проект активен. Значит проблема во вводе — проверьте email/пароль."
                 :`warn:Сервер ответил, но с кодом ${r.status}. Проверьте правильность ключа/URL.`);
    }catch(e){
      setNet("err:Сервер недоступен ("+(e&&e.message||e)+"). Скорее всего проект на паузе или блокируется сетью.");
    }
    setChecking(false);
  };
  return(
    <div style={{height:"100vh",display:"flex",flexDirection:"column",background:"var(--bg)"}}>
      <div style={{display:"flex",justifyContent:"flex-end",padding:"18px 20px"}}>
        <button onClick={flipTheme} title="Тема" style={{width:38,height:38,borderRadius:11,display:"grid",placeItems:"center",color:"var(--tx2)",fontSize:17,cursor:"pointer",border:"1px solid var(--brd)",background:"var(--sur)"}}>{th==="dark"?"☀":"☾"}</button>
      </div>
      <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",padding:"0 20px 8vh"}}>
        <div style={{width:"100%",maxWidth:384,animation:"fadeUp .3s ease"}}>
          <div style={{display:"flex",flexDirection:"column",alignItems:"center",marginBottom:30}}>
            <div style={{width:54,height:54,borderRadius:15,background:"linear-gradient(150deg,var(--ink),var(--pu))",display:"grid",placeItems:"center",fontSize:26,boxShadow:"0 8px 22px color-mix(in srgb,var(--ink) 36%,transparent)",marginBottom:16}}>📦</div>
            <div className="ff" style={{fontSize:27,lineHeight:1.05,letterSpacing:"-.01em",textAlign:"center"}}>Система учёта<br/>и склада</div>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            <Fld label="Email"><Inp value={email} onChange={e=>setEmail(e.target.value)} placeholder="user@bank.kg" onKeyDown={e=>e.key==="Enter"&&submit()}/></Fld>
            <Fld label="Пароль"><Inp type="password" value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()}/></Fld>
            {err&&<div style={{padding:"9px 12px",background:"var(--rd-l)",border:"1px solid var(--rd)",borderRadius:10,fontSize:12,color:"var(--rd-m)",lineHeight:1.5}}>{err}</div>}
            {net&&<div style={{padding:"9px 12px",borderRadius:10,fontSize:12,lineHeight:1.5,background:net.startsWith("ok")?"var(--gr-l)":net.startsWith("warn")?"var(--am-l)":"var(--rd-l)",border:`1px solid ${net.startsWith("ok")?"var(--gr)":net.startsWith("warn")?"var(--am)":"var(--rd)"}`,color:net.startsWith("ok")?"var(--gr-m)":net.startsWith("warn")?"var(--am-m)":"var(--rd-m)"}}>{net.slice(net.indexOf(":")+1)}</div>}
            <Btn onClick={submit} loading={loading} size="lg" style={{width:"100%",marginTop:4}}>Войти</Btn>
            <button onClick={checkConn} disabled={checking} style={{fontSize:12,color:"var(--tx3)",cursor:"pointer",background:"none",border:"none",padding:"2px 0"}}>{checking?"Проверяю…":"Проверить соединение с сервером"}</button>
            <div style={{textAlign:"center",fontSize:10.5,color:"var(--tx3)",marginTop:2}}>{BUILD}</div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ═══ ЯДРО ПРИЛОЖЕНИЯ ═══ */
function App(){
  const{ts,toast}=useToast();
  const[session,setSession]=useState(undefined);
  const[profile,setProfile]=useState(null);
  const[view,setView]=useState("home");
  const[assistAuto,setAssistAuto]=useState(false);
  const[rtOn,setRtOn]=useState(false);
  const[online,setOnline]=useState(typeof navigator!=="undefined"?navigator.onLine!==false:true);
  const[syncedAt,setSyncedAt]=useState(null);
  useEffect(()=>{
    const up=()=>setOnline(true),down=()=>setOnline(false);
    window.addEventListener("online",up);window.addEventListener("offline",down);
    return()=>{window.removeEventListener("online",up);window.removeEventListener("offline",down)};
  },[]);
  const[showOnboard,setShowOnboard]=useState(false);
  const[loading,setLoading]=useState(true);
  const[fallback,setFallback]=useState(false);

  const[ref,setRef]=useState({branches:[],locations:[],suppliers:[],directions:[],categories:[],productTypes:[],recipients:[],profiles:[]});
  const[products,setProducts]=useState([]);
  const[stock,setStock]=useState({});
  const[flows,setFlows]=useState({});
  const[checkouts,setCheckouts]=useState([]);
  const[recentMovements,setRecentMovements]=useState([]);

  // ── сессия
  useEffect(()=>{
    sb.auth.getSession().then(({data})=>setSession(data.session||null));
    const{data:sub}=sb.auth.onAuthStateChange((_e,s)=>setSession(s));
    return()=>sub.subscription.unsubscribe();
  },[]);

  // ── профиль
  useEffect(()=>{
    if(!session){setProfile(null);return}
    (async()=>{
      const{data}=await sb.from("profiles").select("*").eq("id",session.user.id).single();
      const p=data||{id:session.user.id,email:session.user.email,role:"employee",name:session.user.email};
      setProfile(p);
      if(!localStorage.getItem(ONBOARD)){setShowOnboard(true);localStorage.setItem(ONBOARD,"1")}
    })();
  },[session]);

  // ── справочники + товары
  const loadRefData=useCallback(async()=>{
    const q=(t,cols="*")=>sb.from(t).select(cols);
    const[br,lo,su,di,ca,pt,re,pr,prof]=await Promise.all([
      q("branches"),q("locations"),q("suppliers"),q("directions"),q("categories"),q("product_types"),q("recipients"),
      q("products"),q("profiles")
    ]);
    setRef({branches:br.data||[],locations:lo.data||[],suppliers:su.data||[],directions:di.data||[],categories:ca.data||[],productTypes:pt.data||[],recipients:re.data||[],profiles:prof.data||[]});
    setProducts(pr.data||[]);
  },[]);

  // ── резервный расчёт (если вью ещё не созданы)
  const computeFallback=useCallback(async()=>{
    const{data}=await sb.from("movements").select("product_id,recipient_id,branch_id,type,qty,due_date,created_at,sz").order("created_at",{ascending:false});
    const mv=data||[];
    const st={},fl={};
    mv.forEach(m=>{
      const s=m.type==="in"||m.type==="return"?1:-1;
      st[m.product_id]=(st[m.product_id]||0)+s*m.qty;
      const f=fl[m.product_id]||(fl[m.product_id]={in_q:0,out_q:0,ret_q:0,wrt_q:0});
      if(m.type==="in")f.in_q+=m.qty;else if(m.type==="out")f.out_q+=m.qty;else if(m.type==="return")f.ret_q+=m.qty;else if(m.type==="writeoff")f.wrt_q+=m.qty;
    });
    // checkouts: out минус return по (product,recipient,branch)
    const key=m=>`${m.product_id}|${m.recipient_id}|${m.branch_id}`;
    const grp={};
    mv.slice().reverse().forEach(m=>{
      if(m.type!=="out"&&m.type!=="return")return;
      const k=key(m);const g=grp[k]||(grp[k]={product_id:m.product_id,recipient_id:m.recipient_id,branch_id:m.branch_id,remaining:0,due_date:null,created_at:m.created_at,sz:null});
      if(m.type==="out"){g.remaining+=m.qty;if(!g.due_date&&m.due_date)g.due_date=m.due_date;if(!g.sz&&m.sz)g.sz=m.sz;}
      else g.remaining-=m.qty;
    });
    const co=Object.values(grp).filter(g=>g.remaining>0&&g.recipient_id);
    setStock(st);setFlows(fl);setCheckouts(co);
    setRecentMovements(mv.slice(0,100));
  },[]);

  // ── агрегаты через серверные вью
  const loadAggregates=useCallback(async()=>{
    const[vs,vf,vc,rm]=await Promise.all([
      sb.from("v_product_stock").select("*"),
      sb.from("v_product_flows").select("*"),
      sb.from("v_checkouts").select("*"),
      sb.from("movements").select("*").order("created_at",{ascending:false}).limit(100)
    ]);
    if(vs.error||vf.error||vc.error){
      setFallback(true);
      await computeFallback();
      return;
    }
    const st={};(vs.data||[]).forEach(r=>st[r.product_id]=Number(r.stock)||0);
    const fl={};(vf.data||[]).forEach(r=>fl[r.product_id]={in_q:+r.in_q||0,out_q:+r.out_q||0,ret_q:+r.ret_q||0,wrt_q:+r.wrt_q||0});
    const co=(vc.data||[]).map(r=>({...r,remaining:Number(r.remaining)||0}));
    setStock(st);setFlows(fl);setCheckouts(co);setRecentMovements(rm.data||[]);
    setFallback(false);
  },[computeFallback]);

  // ── первичная загрузка
  useEffect(()=>{
    if(!profile)return;
    setLoading(true);
    Promise.all([loadRefData(),loadAggregates()]).finally(()=>{setLoading(false);setSyncedAt(new Date())});
  },[profile,loadRefData,loadAggregates]);

  // ── realtime
  useEffect(()=>{
    if(!profile)return;
    let deb;
    const refresh=()=>{clearTimeout(deb);deb=setTimeout(()=>{fallback?computeFallback():loadAggregates()},400)};
    const ch=sb.channel("rt-mkt")
      .on("postgres_changes",{event:"*",schema:"public",table:"movements"},()=>refresh())
      .on("postgres_changes",{event:"*",schema:"public",table:"products"},()=>{loadRefData()})
      .on("postgres_changes",{event:"*",schema:"public",table:"recipients"},()=>{loadRefData()})
      .subscribe(st=>setRtOn(st==="SUBSCRIBED"));
    return()=>{clearTimeout(deb);sb.removeChannel(ch)};
  },[profile,fallback,loadAggregates,loadRefData,computeFallback]);

  const logout=async()=>{await sb.auth.signOut();setProfile(null);setView("home")};

  // ── права
  const role=profile?.role;
  const can=useCallback(k=>{
    if(role==="admin")return true;
    if(k==="admin")return false;
    if(k==="reports"||k==="suppliers")return role==="director";
    if(k==="move"||k==="edit")return role==="manager";
    return false;
  },[role]);
  const isRestricted=role==="manager"||role==="employee";
  const userBranchId=profile?.branch_id||null;

  const gsFlags=useMemo(()=>({
    addProduct:products.length>0,
    addRecipient:ref.recipients.length>0,
    firstIn:Object.values(flows).some(f=>f.in_q>0),
    firstOut:Object.values(flows).some(f=>f.out_q>0),
  }),[products,ref.recipients,flows]);

  const overdue=useMemo(()=>checkouts.filter(c=>c.due_date&&c.due_date<TODAY),[checkouts]);

  const S={
    ...ref,products,stock,flows,checkouts,recentMovements,profile,can,toast,isRestricted,userBranchId,gsFlags,
    categories:ref.categories,productTypes:ref.productTypes,
  };

  const ALLOWED={
    admin:["home","items","activity","assistant","branches","recipients","reports","suppliers","settings","users"],
    director:["home","items","activity","assistant","branches","recipients","reports","suppliers"],
    manager:["home","items","activity","assistant","branches","recipients"],
    employee:["home","items","activity","assistant"],
  };
  const allowed=ALLOWED[role]||ALLOWED.employee;
  const safeView=allowed.includes(view)?view:"home";

  if(session===undefined)return<div style={{height:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"var(--bg)"}}><Spin s={28}/></div>;
  if(!session)return<Login onLogin={u=>setSession(s=>s)}/>;
  if(!profile||loading)return<div style={{height:"100vh",display:"flex",flexDirection:"column",gap:14,alignItems:"center",justifyContent:"center",background:"var(--bg)"}}><div style={{width:48,height:48,background:"linear-gradient(135deg,var(--ink),var(--pu))",borderRadius:13,display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,animation:"pulse 1.2s infinite"}}>📦</div><span style={{color:"var(--tx3)",fontSize:13}}>Загрузка данных…</span></div>;

  const VIEWS={
    home:<Home S={S} stock={stock} checkouts={checkouts} setView={setView}/>,
    items:<ItemsView S={S} stock={stock} checkouts={checkouts}/>,
    activity:<ActivityView S={S} checkouts={checkouts} overdue={overdue}/>,
    assistant:<AssistantView S={S} stock={stock} checkouts={checkouts} setView={setView} autostart={assistAuto} onAutostart={()=>setAssistAuto(false)}/>,
    branches:<BranchesView S={S} checkouts={checkouts}/>,
    recipients:<RecipientsView S={S}/>,
    reports:<ReportsView S={S} stock={stock}/>,
    suppliers:<SuppliersView S={S}/>,
    settings:<SettingsView S={S} refreshData={loadRefData}/>,
    users:<UsersView S={S}/>,
  };

  return(
    <div style={{display:"flex",height:"100vh",overflow:"hidden"}}>
      {showOnboard&&<Onboarding role={role} onDone={()=>setShowOnboard(false)}/>}
      <Sidebar view={safeView} setView={setView} profile={profile} onLogout={logout} overdueCount={overdue.length} rtOn={rtOn}/>
      <main style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column"}}>
        {!online&&<div style={{padding:"8px 22px",background:"var(--am-l)",borderBottom:"1px solid var(--am)",fontSize:12.5,color:"var(--am-m)",display:"flex",alignItems:"center",gap:9,flexShrink:0}}>
          <span style={{width:8,height:8,borderRadius:"50%",background:"var(--am)",flexShrink:0}}/>
          <span style={{fontWeight:600}}>Нет сети.</span>
          <span>Данные показаны {syncedAt?`на ${syncedAt.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})}`:"на момент последней синхронизации"}. Операции лучше проводить после восстановления связи.</span>
        </div>}
        {false&&<div style={{padding:"7px 22px",background:"var(--am-l)",borderBottom:"1px solid var(--am)",fontSize:12,color:"var(--am-m)",display:"flex",alignItems:"center",gap:8,flexShrink:0}}>⚠ Резервный режим расчёта.</div>}
        {VIEWS[safeView]}
      </main>
      <Toasts ts={ts}/>
      {safeView!=="assistant"&&<button onClick={()=>{setAssistAuto(true);setView("assistant")}} title="Люси — голосовой помощник"
        style={{position:"fixed",right:26,bottom:26,zIndex:70,width:58,height:58,borderRadius:"50%",border:"none",cursor:"pointer",
          background:"linear-gradient(150deg,var(--ink),var(--pu))",color:"#fff",display:"grid",placeItems:"center",
          boxShadow:"0 8px 24px color-mix(in srgb,var(--ink) 45%,transparent),0 2px 6px rgba(0,0,0,.2)",transition:"transform .16s"}}
        onMouseEnter={e=>e.currentTarget.style.transform="translateY(-2px) scale(1.04)"}
        onMouseLeave={e=>e.currentTarget.style.transform="none"}>
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3ZM6 11a6 6 0 0 0 12 0M12 19v3"/></svg>
      </button>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
(function(){
  var root=document.getElementById("root");
  function fail(msg){root.innerHTML='<div style="padding:48px;max-width:560px;margin:40px auto;font-family:system-ui,sans-serif;color:var(--tx);background:#fff;border:1px solid var(--brd);border-radius:16px"><div style="font-size:20px;font-weight:700;margin-bottom:8px">Не удалось запустить приложение</div><div style="font-size:13px;color:var(--tx2);line-height:1.6">'+msg+'</div></div>';}
  if(typeof Babel==="undefined"){fail("Не загрузилась библиотека Babel. Проверьте интернет-соединение и что CDN unpkg.com доступен.");return;}
  try{
    var src=document.getElementById("app-src").textContent;
    var out=Babel.transform(src,{presets:[["react",{runtime:"classic"}]]}).code;
    var s=document.createElement("script");
    s.textContent=out;
    document.body.appendChild(s);
  }catch(e){
    console.error(e);
    fail("Ошибка выполнения: "+(e&&e.message?e.message:e));
  }
})();
</script>
